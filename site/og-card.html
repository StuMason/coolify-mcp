<!doctype html>
<!--
  Source for public/og.png. Rendered to PNG at 1200×630 by scripts/og.mjs.
  Kept as HTML so the card can be re-generated when the wording changes,
  rather than being a binary nobody can edit.
-->
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #ffffff;
        color: #0a0a0a;
        font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px;
      }
      .mark {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.05em;
      }
      .mark span {
        color: #e5341f;
      }
      h1 {
        font-size: 78px;
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 0.98;
        max-width: 15ch;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid #e4e4e4;
        padding-top: 26px;
      }
      .foot p {
        font-size: 21px;
        color: #6e6e6e;
      }
      .foot .by {
        font-size: 19px;
        color: #9a9a9a;
      }
    </style>
  </head>
  <body>
    <p class="mark">coolify-mcp<span>.</span></p>
    <h1>Your AI can read your infrastructure. It should be able to run it.</h1>
    <div class="foot">
      <p>Deploy, diagnose, restart, roll back — from Claude, Cursor or any MCP client.</p>
      <p class="by">stumason.dev</p>
    </div>
  </body>
</html>
