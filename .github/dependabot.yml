version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '06:00'
      timezone: 'Europe/London'
    open-pull-requests-limit: 10
    # Patch and minor updates auto-merge once CI passes, and `npm audit` cannot
    # flag a release compromised an hour ago because no advisory exists yet.
    # Waiting a few days before opening the PR closes the window in which a
    # hijacked publish would be merged automatically. Majors are reviewed by a
    # human anyway, so the wait matters least for them.
    cooldown:
      default-days: 3
      semver-major-days: 0
    # Group minor/patch updates together to reduce PR noise
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    # TypeScript majors regularly ship breaking type changes (e.g. 6.0.3 broke
    # the build (24.x) matrix in #171). Pin to minors until we explicitly migrate.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    # Auto-assign for review
    reviewers:
      - 'StuMason'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/London'
    commit-message:
      prefix: 'ci(deps)'
    labels:
      - 'dependencies'
      - 'github-actions'
