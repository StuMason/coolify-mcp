name: Docs index refresh

# The bundled Coolify docs index (#372) tracks coolify.io/docs/llms.txt.
# Weekly: fetch the live file, and if the bundle is behind, open (or update)
# a PR with the refreshed copy. Nothing merges on its own.
#
# A PR opened with the workflow token does not trigger CI on its own, so the
# PR body asks the reviewer to push an empty commit (or run `npm test`
# locally) before merging; the script has already validated the file with
# the runtime parser, which is the check that matters.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh the bundle from live
        id: refresh
        run: |
          set +e
          node scripts/build-docs-index.mjs
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "live index unreachable or unusable; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" != "0" ]; then
            echo "refresh script failed with exit $code"
            exit "$code"
          fi
          if git diff --quiet -- src/data/coolify-docs.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the refresh PR
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=chore/docs-index-refresh
          pages=$(node -p "require('./src/data/coolify-docs.json').entries")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # actions/checkout fetches only the default ref; the lease needs
          # the remote branch known locally or every run after the first fails.
          git fetch origin "$branch" || true
          git checkout -B "$branch"
          git add src/data/coolify-docs.json
          git commit -m "chore: refresh the bundled Coolify docs index ($pages pages)"
          git push --force-with-lease origin "$branch"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr comment "$branch" --body "Refreshed again on $(date -u +%Y-%m-%d): $pages pages."
          else
            gh pr create --base main --head "$branch" \
              --title "chore: refresh the bundled Coolify docs index" \
              --body "$(printf 'Weekly refresh of `src/data/coolify-docs.json` from https://coolify.io/docs/llms.txt (#372): %s pages, validated with the runtime parser.\n\nGenerated by the docs-index workflow. CI does not start on PRs the workflow token opens: push an empty commit to this branch to run it, review the diff for pages that moved, then merge.' "$pages")"
          fi
