  responses:
    '400':
      description: 'Invalid token.'
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: 'Invalid token.'
            type: object
    '401':
      description: Unauthenticated.
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: Unauthenticated.
            type: object
    '404':
      description: 'Resource not found.'
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: 'Resource not found.'
            type: object
    '422':
      description: 'Validation error.'
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: 'Validation error.'
              errors:
                type: object
                example:
                  name: ['The name field is required.']
                  api_url: ['The api url field is required.', 'The api url format is invalid.']
                additionalProperties:
                  type: array
                  items: { type: string }
            type: object
    '429':
      description: 'Rate limit exceeded.'
      headers:
        Retry-After:
          description: 'Number of seconds to wait before retrying.'
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: 'Rate limit exceeded. Please try again later.'
            type: object
    '502':
      description: 'The cloud provider API rejected the request.'
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: 'Failed to create Hetzner server. The Hetzner API token does not have permission for this request. Use a token with read and write access.'
              provider_status:
                description: 'The HTTP status from the cloud provider API.'
                type: integer
                example: 403
              provider_error_code:
                description: 'The error code from the cloud provider API, if it has one.'
                type:
                  - string
                  - 'null'
                example: forbidden
            type: object
  parameters:
    VulnerabilityState:
      name: state
      in: query
      description: 'Comma-separated finding states: fixed, no_fix, ignored. All when not sent.'
      required: false
      schema:
        type: string
    VulnerabilitySeverity:
      name: severity
      in: query
      description: 'Comma-separated severities: critical, high, medium, low, unknown.'
      required: false
      schema:
        type: string
    VulnerabilityImage:
      name: image
      in: query
      description: 'Only the findings of this scanned image ref.'
      required: false
      schema:
        type: string
    VulnerabilitySearch:
      name: search
      in: query
      description: 'Text in the vulnerability ID, an alias, the package, or the version.'
      required: false
      schema:
        type: string
    VulnerabilityPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    VulnerabilityPerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 200
        minimum: 1
  securitySchemes:
    bearerAuth:
      type: http
      description: 'Go to `Keys & Tokens` / `API tokens` and create a new token. Use the token as the bearer token.'
      scheme: bearer
