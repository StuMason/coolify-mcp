          type: string
        name:
          type: string
        network:
          type: string
        type:
          type: string
          enum:
            - standalone
            - swarm
        server_uuid:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    Tag:
      description: 'Tag model'
      properties:
        uuid:
          type: string
        name:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
      type: object
    Team:
      description: 'Team model'
