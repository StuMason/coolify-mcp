openapi: 3.1.0
info:
  title: Coolify
  version: '0.1'
paths:
  '/{resource_type}/{uuid}/secret-manager':
    get:
      tags:
        - 'Secret Managers'
      summary: 'Get Secret Manager Source'
      description: 'The secret manager source of an application, service, or database, and the secret manager tokens of its team that can be linked.'
      operationId: get-secret-manager-source
      parameters:
        -
          name: resource_type
          in: path
          description: 'Resource type.'
          required: true
          schema:
            type: string
            enum:
              - applications
              - services
              - databases
        -
          name: uuid
          in: path
          description: 'Resource UUID.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Secret manager source.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretManagerSource'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'No access to the resource.'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - 'Secret Managers'
      summary: 'Remove Secret Manager Source'
      description: 'Remove the secret manager source. Existing {{vault.*}} variables stay and fail the next deployment until they are removed.'
      operationId: remove-secret-manager-source
      parameters:
        -
          name: resource_type
          in: path
          description: 'Resource type.'
          required: true
          schema:
            type: string
            enum:
              - applications
              - services
              - databases
        -
          name: uuid
          in: path
          description: 'Resource UUID.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Source removed.'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'No write access to the resource.'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - 'Secret Managers'
      summary: 'Set Secret Manager Source'
      description: 'Link a secret manager token of the team to an application, service, or database, or change the token or settings of the link. References resolve at the next deployment.'
      operationId: set-secret-manager-source
      parameters:
        -
          name: resource_type
          in: path
          description: 'Resource type.'
          required: true
          schema:
            type: string
            enum:
              - applications
              - services
              - databases
        -
          name: uuid
          in: path
          description: 'Resource UUID.'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - integration_token_uuid
              properties:
                integration_token_uuid:
                  type: string
                settings:
                  description: 'Doppler service account: project, config. Infisical: project_id, environment, secret_path. Vault: mount, path.'
                  type: object
              type: object
      responses:
        '200':
          description: 'Secret manager configured.'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'No write access to the resource.'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/{resource_type}/{uuid}/secret-manager/import':
    post:
      tags:
        - 'Secret Managers'
      summary: 'Import Secret Manager References'
      description: 'Add a {{vault.KEY}} environment variable for every key of the linked source that has no variable yet. Keys that are not valid variable names are skipped.'
      operationId: import-secret-manager-references
      parameters:
        -
          name: resource_type
          in: path
          description: 'Resource type.'
          required: true
          schema:
            type: string
            enum:
              - applications
              - services
              - databases
        -
          name: uuid
          in: path
          description: 'Resource UUID.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Import result.'
          content:
            application/json:
              schema:
                properties:
                  imported: { type: array, items: { type: string } }
                  skipped: { type: array, items: { type: string } }
                type: object
        '400':
          description: 'The secret manager did not return the keys.'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'No write access to the resource.'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
  '/{resource_type}/{uuid}/secret-manager/keys':
    get:
      tags:
        - 'Secret Managers'
      summary: 'List Secret Manager Keys'
      description: 'Key names of the secrets in the linked source. Values are never returned. Requires write access, like the resource page, because the stored secret is sent to the secret manager.'
      operationId: list-secret-manager-keys
      parameters:
        -
          name: resource_type
          in: path
          description: 'Resource type.'
          required: true
          schema:
            type: string
            enum:
              - applications
              - services
              - databases
        -
          name: uuid
          in: path
          description: 'Resource UUID.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Key names.'
          content:
            application/json:
              schema:
                properties:
                  keys: { type: array, items: { type: string } }
                type: object
        '400':
          description: 'The secret manager did not return the keys.'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'No write access to the resource.'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
  '/{resource_type}/{uuid}/secret-manager/references':
    post:
      tags:
        - 'Secret Managers'
      summary: 'Add Secret Manager Reference'
      description: 'Add a {{vault.KEY}} environment variable for one key of the linked source.'
      operationId: add-secret-manager-reference
      parameters:
        -
          name: resource_type
          in: path
          description: 'Resource type.'
          required: true
          schema:
            type: string
            enum:
              - applications
              - services
              - databases
        -
          name: uuid
          in: path
          description: 'Resource UUID.'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - key
              properties:
                key:
                  type: string
              type: object
      responses:
        '201':
          description: 'Variable added.'
        '400':
          description: 'The secret manager did not return the keys.'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'No write access to the resource.'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: 'Not a key of the source, not a valid variable name, or the variable exists.'
      security:
        -
          bearerAuth: []
  /audit-events:
    get:
      tags:
        - 'Audit Events'
      summary: List
      description: 'List audit events of the team. Only team admins and owners can view audit events. Actor e-mail, token, metadata, changes, IP address, and user agent are returned only for tokens with the read:sensitive or root permission.'
      operationId: list-audit-events
      parameters:
        -
          name: per_page
          in: query
          description: 'Items per page.'
          required: false
          schema:
            type: integer
            default: 25
            maximum: 100
            minimum: 1
        -
          name: page
          in: query
          description: 'Page number.'
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        -
          name: search
          in: query
          description: 'Search text.'
          required: false
          schema:
            type: string
            maxLength: 255
        -
          name: action
          in: query
          description: 'Filter by action. Use all for every action.'
          required: false
          schema:
            type: string
            maxLength: 255
        -
          name: source
          in: query
          description: 'Filter by source.'
          required: false
          schema:
            type: string
            enum:
              - all
              - ui
              - api
              - mcp
              - webhook
              - system
              - scheduler
      responses:
        '200':
          description: 'A page of audit events, newest first.'
          content:
            application/json:
              schema:
                properties:
                  current_page: { type: integer }
                  data: { type: array, items: { type: object, properties: { id: { type: integer }, team_id: { type: integer, nullable: true }, event: { type: string }, source: { type: string }, action: { type: string }, level: { type: string }, actor_type: { type: string, nullable: true }, actor_id: { type: integer, nullable: true }, actor_name: { type: string, nullable: true }, resource_type: { type: string, nullable: true }, resource_uuid: { type: string, nullable: true }, resource_name: { type: string, nullable: true }, description: { type: string, nullable: true }, created_at: { type: string, format: date-time } } } }
                  per_page: { type: integer }
                  last_page: { type: integer }
                  total: { type: integer }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'Only team admins and owners can view audit logs.'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  /cloud-tokens:
    get:
      tags:
        - 'Cloud Tokens'
      summary: 'List Cloud Provider Tokens'
      description: 'List all cloud provider tokens for the authenticated team.'
      operationId: list-cloud-tokens
      responses:
        '200':
          description: 'Get all cloud provider tokens.'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { uuid: { type: string }, name: { type: string }, provider: { type: string, enum: [hetzner, digitalocean, vultr, hostinger] }, team_id: { type: integer }, servers_count: { type: integer }, created_at: { type: string }, updated_at: { type: string } }
                  type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'Only team admins and owners can manage cloud provider tokens.'
        '400':
          $ref: '#/components/responses/400'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - 'Cloud Tokens'
      summary: 'Create Cloud Provider Token'
      description: 'Create a new cloud provider token. The token will be validated before being stored.'
      operationId: create-cloud-token
      requestBody:
        description: 'Cloud provider token details'
        required: true
        content:
          application/json:
            schema:
              required:
                - provider
                - token
                - name
              properties:
                provider:
                  type: string
                  enum: [hetzner, digitalocean, vultr, hostinger]
                  example: hetzner
                  description: 'The cloud provider.'
                token:
                  type: string
                  example: your-api-token-here
                  description: 'The API token for the cloud provider.'
                name:
                  type: string
                  example: 'My Hetzner Token'
                  description: 'A friendly name for the token.'
              type: object
      responses:
        '201':
          description: 'Cloud provider token created.'
          content:
            application/json:
              schema:
                properties:
                  uuid: { type: string, example: og888os, description: 'The UUID of the token.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'Only team admins and owners can manage cloud provider tokens.'
        '400':
          $ref: '#/components/responses/400'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/cloud-tokens/{uuid}':
    get:
      tags:
        - 'Cloud Tokens'
      summary: 'Get Cloud Provider Token'
      description: 'Get cloud provider token by UUID.'
      operationId: get-cloud-token-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'Token UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Get cloud provider token by UUID'
          content:
            application/json:
              schema:
                properties:
                  uuid: { type: string }
                  name: { type: string }
                  provider: { type: string }
                  team_id: { type: integer }
                  servers_count: { type: integer }
                  created_at: { type: string }
                  updated_at: { type: string }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'Only team admins and owners can manage cloud provider tokens.'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - 'Cloud Tokens'
      summary: 'Delete Cloud Provider Token'
      description: 'Delete cloud provider token by UUID. Cannot delete if token is used by any servers.'
      operationId: delete-cloud-token-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'UUID of the cloud provider token.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Cloud provider token deleted.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Cloud provider token deleted.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'Only team admins and owners can manage cloud provider tokens.'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - 'Cloud Tokens'
      summary: 'Update Cloud Provider Token'
      description: 'Update cloud provider token name.'
      operationId: update-cloud-token-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'Token UUID'
          required: true
          schema:
            type: string
      requestBody:
        description: 'Cloud provider token updated.'
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  description: 'The friendly name for the token.'
              type: object
      responses:
        '200':
          description: 'Cloud provider token updated.'
          content:
            application/json:
              schema:
                properties:
                  uuid: { type: string }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'Only team admins and owners can manage cloud provider tokens.'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/cloud-tokens/{uuid}/validate':
    post:
      tags:
        - 'Cloud Tokens'
      summary: 'Validate Cloud Provider Token'
      description: 'Validate a cloud provider token against the provider API.'
      operationId: validate-cloud-token-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'Token UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Token validation result.'
          content:
            application/json:
              schema:
                properties:
                  valid: { type: boolean, example: true }
                  message: { type: string, example: 'Token is valid.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'Only team admins and owners can manage cloud provider tokens.'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
  /disable:
    post:
      summary: 'Disable API'
      description: 'Disable API (only with root permissions).'
      operationId: disable-api
      responses:
        '200':
          description: 'Disable API.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'API disabled.' }
                type: object
        '403':
          description: 'You are not allowed to disable the API.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'You are not allowed to disable the API.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
      security:
        -
          bearerAuth: []
  /dns/zones:
    get:
      tags:
        - DNS
      summary: 'List DNS Zones'
      description: 'List the DNS zones that the Cloudflare tokens of the team can access. Requires admin or owner.'
      operationId: list-dns-zones
      responses:
        '200':
          description: 'DNS zones.'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { zone: { type: string }, account_name: { type: [string, 'null'] }, integration_token_uuid: { type: string }, integration_token_name: { type: string }, managed_records_count: { type: integer } }
                  type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'Not an admin or owner of the team.'
      security:
        -
          bearerAuth: []
  /gitea-apps:
    get:
      tags:
        - 'Gitea Apps'
      summary: List
      description: 'List all Gitea apps for the current team (and system-wide sources).'
      operationId: list-gitea-apps
      responses:
        '200':
          description: 'List of Gitea apps.'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { id: { type: integer }, uuid: { type: string }, name: { type: string }, organization: { type: string, nullable: true }, api_url: { type: string }, html_url: { type: string }, custom_user: { type: string }, custom_port: { type: integer }, client_id: { type: string, nullable: true }, redirect_uri: { type: string, nullable: true }, is_system_wide: { type: boolean }, is_public: { type: boolean }, is_connected: { type: boolean, description: 'True when the OAuth connection is complete and the source can deploy private repositories.' }, team_id: { type: integer } }
                  type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
      security:
        -
          bearerAuth: []
  /github-apps:
    get:
      tags:
        - 'GitHub Apps'
      summary: List
      description: 'List all GitHub apps.'
      operationId: list-github-apps
      responses:
        '200':
          description: 'List of GitHub apps.'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { id: { type: integer }, uuid: { type: string }, name: { type: string }, organization: { type: string, nullable: true }, api_url: { type: string }, html_url: { type: string }, custom_user: { type: string }, custom_port: { type: integer }, app_id: { type: integer }, installation_id: { type: integer }, client_id: { type: string }, private_key_id: { type: integer }, is_system_wide: { type: boolean }, is_public: { type: boolean }, team_id: { type: integer }, type: { type: string } }
                  type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - 'GitHub Apps'
      summary: 'Create GitHub App'
      description: 'Create a new GitHub app.'
      operationId: create-github-app
      requestBody:
        description: 'GitHub app creation payload.'
        required: true
        content:
          application/json:
            schema:
              required:
                - name
                - html_url
                - app_id
                - installation_id
                - client_id
                - client_secret
                - private_key_uuid
              properties:
                name:
                  type: string
                  description: 'Name of the GitHub app.'
                organization:
                  type: string
                  nullable: true
                  description: 'Organization to associate the app with.'
                api_url:
                  type: string
                  description: 'API URL for the GitHub app (e.g., https://api.github.com).'
                html_url:
                  type: string
                  description: 'HTML URL for the GitHub app (e.g., https://github.com).'
                custom_user:
                  type: string
                  description: 'Custom user for SSH access (default: git).'
                custom_port:
                  type: integer
                  description: 'Custom port for SSH access (default: 22).'
                app_id:
                  type: integer
                  description: 'GitHub App ID from GitHub.'
                installation_id:
                  type: integer
                  description: 'GitHub Installation ID.'
                client_id:
                  type: string
                  description: 'GitHub OAuth App Client ID.'
                client_secret:
                  type: string
                  description: 'GitHub OAuth App Client Secret.'
                webhook_secret:
                  type: string
                  description: 'Webhook secret for GitHub webhooks.'
                private_key_uuid:
                  type: string
                  description: 'UUID of an existing private key for GitHub App authentication.'
                is_system_wide:
                  type: boolean
                  description: 'Is this app system-wide (cloud only).'
              type: object
      responses:
        '201':
          description: 'GitHub app created successfully.'
          content:
            application/json:
              schema:
                properties:
                  id: { type: integer }
                  uuid: { type: string }
                  name: { type: string }
                  organization: { type: string, nullable: true }
                  api_url: { type: string }
                  html_url: { type: string }
                  custom_user: { type: string }
                  custom_port: { type: integer }
                  app_id: { type: integer }
                  installation_id: { type: integer }
                  client_id: { type: string }
                  private_key_id: { type: integer }
                  is_system_wide: { type: boolean }
                  team_id: { type: integer }
                type: object
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/github-apps/{github_app_id}':
    delete:
      tags:
        - 'GitHub Apps'
      summary: 'Delete GitHub App'
      description: "Delete a GitHub app if it's not being used by any applications."
      operationId: deleteGithubApp
      parameters:
        -
          name: github_app_id
          in: path
          description: 'GitHub App ID'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'GitHub app deleted successfully'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'GitHub app deleted successfully' }
                type: object
        '401':
          description: Unauthorized
        '404':
          description: 'GitHub app not found'
        '409':
          description: 'Conflict - GitHub app is in use'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'This GitHub app is being used by 5 application(s). Please delete all applications first.' }
                type: object
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - 'GitHub Apps'
      summary: 'Update GitHub App'
      description: 'Update an existing GitHub app.'
      operationId: updateGithubApp
      parameters:
        -
          name: github_app_id
          in: path
          description: 'GitHub App ID'
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  description: 'GitHub App name'
                organization:
                  type: string
                  nullable: true
                  description: 'GitHub organization'
                api_url:
                  type: string
                  description: 'GitHub API URL'
                html_url:
                  type: string
                  description: 'GitHub HTML URL'
                custom_user:
                  type: string
                  description: 'Custom user for SSH'
                custom_port:
                  type: integer
                  description: 'Custom port for SSH'
                app_id:
                  type: integer
                  description: 'GitHub App ID'
                installation_id:
                  type: integer
                  description: 'GitHub Installation ID'
                client_id:
                  type: string
                  description: 'GitHub Client ID'
                client_secret:
                  type: string
                  description: 'GitHub Client Secret'
                webhook_secret:
                  type: string
                  description: 'GitHub Webhook Secret'
                private_key_uuid:
                  type: string
                  description: 'Private key UUID'
                is_system_wide:
                  type: boolean
                  description: 'Is system wide (non-cloud instances only)'
              type: object
      responses:
        '200':
          description: 'GitHub app updated successfully'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'GitHub app updated successfully' }
                  data: { type: object, description: 'Updated GitHub app data' }
                type: object
        '401':
          description: Unauthorized
        '404':
          description: 'GitHub app not found'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/github-apps/{github_app_id}/repositories':
    get:
      tags:
        - 'GitHub Apps'
      summary: 'Load Repositories for a GitHub App'
      description: 'Fetch repositories from GitHub for a given GitHub app.'
      operationId: load-repositories
      parameters:
        -
          name: github_app_id
          in: path
          description: 'GitHub App ID'
          required: true
          schema:
            type: integer
      responses:
        '200':
