          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - 'S3 Storages'
      summary: 'Create S3 Storage'
      description: 'Create a new S3 storage configuration for the authenticated team.'
      operationId: create-s3-storage
      requestBody:
        description: 'S3 storage details'
        required: true
        content:
          application/json:
            schema:
              required:
                - name
                - endpoint
                - bucket
                - region
                - key
                - secret
              properties:
                name:
                  type: string
                  example: 'My S3 Storage'
                  description: 'A friendly name for the storage.'
                description:
                  type: string
                  nullable: true
                  description: 'Optional description.'
                endpoint:
                  type: string
                  example: 'https://s3.us-east-1.amazonaws.com'
                  description: 'S3-compatible endpoint URL.'
                bucket:
                  type: string
                  example: my-bucket
                  description: 'S3 bucket name.'
                region:
                  type: string
                  example: us-east-1
                  description: 'S3 region.'
                key:
                  type: string
                  description: 'Access key.'
                secret:
                  type: string
                  description: 'Secret key.'
                is_usable:
                  type: boolean
                  description: 'Whether the storage is marked usable.'
              type: object
      responses:
        '201':
          description: 'S3 storage created.'
          content:
            application/json:
              schema:
                properties:
                  uuid: { type: string, example: og888os, description: 'The UUID of the S3 storage.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
