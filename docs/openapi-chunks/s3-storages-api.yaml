openapi: 3.1.0
info:
  title: Coolify
  version: '0.1'
paths:
  /s3-storages:
    get:
      tags:
        - 'S3 Storages'
      summary: 'List S3 Storages'
      description: 'List all backup storages (S3, SFTP, FTPS, and WebDAV) for the authenticated team.'
      operationId: list-s3-storages
      responses:
        '200':
          description: 'Get all S3 storages.'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { uuid: { type: string }, type: { type: string, enum: [s3, sftp, ftps, webdav] }, name: { type: string }, description: { type: string, nullable: true }, endpoint: { type: string }, bucket: { type: string, nullable: true, description: 'S3 only. Null for the other types.' }, region: { type: string, description: 'S3 only. The other types have a placeholder value.' }, use_path_style_endpoint: { type: boolean }, skip_tls_verification: { type: boolean }, private_key_uuid: { type: string, nullable: true, description: 'SFTP only: the UUID of the private key used to log in. Null with a password login.' }, sftp_host_key: { type: string, nullable: true, description: 'SFTP only: the pinned host key of the server, as "<key type> <base64>". Saved by the first successful connection test.' }, is_usable: { type: boolean }, team_id: { type: integer }, created_at: { type: string }, updated_at: { type: string } }
                  type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - 'S3 Storages'
      summary: 'Create S3 Storage'
      description: 'Create a new S3 storage configuration for the authenticated team.'
      operationId: create-s3-storage
      requestBody:
        description: 'S3 storage details'
        required: true
        content:
          application/json:
            schema:
              required:
                - name
                - endpoint
                - key
              properties:
                type:
                  type: string
                  enum: [s3, sftp, ftps, webdav]
                  default: s3
                  description: 'The storage protocol. It cannot change later.'
                name:
                  type: string
                  example: 'My S3 Storage'
                  description: 'A friendly name for the storage.'
                description:
                  type: string
                  nullable: true
                  description: 'Optional description.'
                endpoint:
                  type: string
                  example: 'https://s3.us-east-1.amazonaws.com'
                  description: 'S3: the S3-compatible endpoint URL. SFTP and FTPS: sftp://host:port/directory or ftps://host:port/directory (explicit TLS); the directory is an absolute path, and without one the login directory is used. WebDAV: the https URL of the backup directory.'
                bucket:
                  type: string
                  example: my-bucket
                  description: 'S3 bucket name. Required for S3, not allowed for the other types.'
                region:
                  type: string
                  example: us-east-1
                  description: 'S3 region. Required for S3, not allowed for the other types.'
                use_path_style_endpoint:
                  type: boolean
                  description: 'Use path-style URLs (endpoint/bucket). Set to false for providers that only accept virtual-hosted-style URLs (bucket.endpoint). Default: false for Alibaba Cloud OSS, Tencent Cloud COS, and Volcengine TOS endpoints, true for all other endpoints.'
                skip_tls_verification:
                  type: boolean
                  description: 'S3 only. Do not check the TLS certificate of the endpoint. Use only for endpoints with a self-signed or private CA certificate. Default: false.'
                key:
                  type: string
                  description: 'S3: the access key. Other types: the username.'
                secret:
                  type: string
                  description: 'S3: the secret key. Other types: the password. SFTP: not needed with private_key_uuid.'
                private_key_uuid:
                  type: string
                  nullable: true
                  description: 'SFTP only: the UUID of a private key of your team to log in with instead of a password.'
                is_usable:
                  type: boolean
                  description: 'Whether the storage is marked usable.'
              type: object
      responses:
        '201':
          description: 'S3 storage created.'
          content:
            application/json:
              schema:
                properties:
                  uuid: { type: string, example: og888os, description: 'The UUID of the S3 storage.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/s3-storages/{uuid}':
    get:
      tags:
        - 'S3 Storages'
      summary: 'Get S3 Storage'
      description: 'Get S3 storage by UUID.'
      operationId: get-s3-storage-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'S3 Storage UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Get S3 storage by UUID'
          content:
            application/json:
              schema:
                properties:
                  uuid: { type: string }
                  type: { type: string, enum: [s3, sftp, ftps, webdav] }
                  name: { type: string }
                  description: { type: string, nullable: true }
                  endpoint: { type: string }
                  bucket: { type: string, nullable: true, description: 'S3 only. Null for the other types.' }
                  region: { type: string, description: 'S3 only. The other types have a placeholder value.' }
                  use_path_style_endpoint: { type: boolean }
                  skip_tls_verification: { type: boolean }
                  private_key_uuid: { type: string, nullable: true, description: 'SFTP only: the UUID of the private key used to log in. Null with a password login.' }
                  sftp_host_key: { type: string, nullable: true, description: 'SFTP only: the pinned host key of the server, as "<key type> <base64>". Saved by the first successful connection test.' }
                  is_usable: { type: boolean }
                  team_id: { type: integer }
                  created_at: { type: string }
                  updated_at: { type: string }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - 'S3 Storages'
      summary: 'Delete S3 Storage'
      description: 'Delete S3 storage by UUID.'
      operationId: delete-s3-storage-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'UUID of the S3 storage.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'S3 storage deleted.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'S3 storage deleted.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - 'S3 Storages'
      summary: 'Update S3 Storage'
      description: 'Update S3 storage by UUID. The type cannot change, and only the fields of the storage type are accepted.'
      operationId: update-s3-storage-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'S3 Storage UUID'
          required: true
          schema:
            type: string
      requestBody:
        description: 'S3 storage fields to update.'
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  description: 'A friendly name for the storage.'
                description:
                  type: string
                  nullable: true
                  description: 'Optional description.'
                endpoint:
                  type: string
                  description: 'The endpoint URL, in the format of the storage type (see Create S3 Storage).'
                bucket:
                  type: string
                  description: 'S3 bucket name. Only for S3 storages.'
                region:
                  type: string
                  description: 'S3 region. Only for S3 storages.'
                use_path_style_endpoint:
                  type: boolean
                  description: 'Use path-style URLs (endpoint/bucket). Set to false for providers that only accept virtual-hosted-style URLs (bucket.endpoint), such as Alibaba Cloud OSS.'
                skip_tls_verification:
                  type: boolean
                  description: 'S3 only. Do not check the TLS certificate of the endpoint. Use only for endpoints with a self-signed or private CA certificate. Default: false.'
                key:
                  type: string
                  description: 'S3: the access key. Other types: the username.'
                secret:
                  type: string
                  description: 'S3: the secret key. Other types: the password. SFTP: sending a password switches the login to the password.'
                private_key_uuid:
                  type: string
                  nullable: true
                  description: 'SFTP only: the UUID of a private key of your team to log in with. Null switches the login to the saved password.'
                is_usable:
                  type: boolean
                  description: 'Whether the storage is marked usable.'
              type: object
      responses:
        '200':
          description: 'S3 storage updated.'
          content:
            application/json:
              schema:
                properties:
                  uuid: { type: string }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/s3-storages/{uuid}/validate':
    post:
      tags:
        - 'S3 Storages'
      summary: 'Validate S3 Storage'
      description: 'Validate a storage connection. S3: lists the bucket (ListObjectsV2). SFTP, FTPS, and WebDAV: lists the backup directory; for SFTP, the first successful validation pins the host key of the server.'
      operationId: validate-s3-storage-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'S3 Storage UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'S3 storage validation result.'
          content:
            application/json:
              schema:
                properties:
                  valid: { type: boolean, example: true }
                  message: { type: string, example: 'S3 storage connection is valid.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
