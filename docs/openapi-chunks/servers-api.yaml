                sentinel_token:
                  type: string
                sentinel_metrics_refresh_rate_seconds:
                  type: integer
                  minimum: 1
                sentinel_metrics_history_days:
                  type: integer
                  minimum: 1
                sentinel_push_interval_seconds:
                  type: integer
                  minimum: 10
                sentinel_custom_url:
                  type: [string, 'null']
                traffic_topn:
                  type: integer
                  minimum: 1
                traffic_sample_threshold:
                  type: integer
                  minimum: 0
                traffic_retention_1h_days:
                  type: integer
                  minimum: 1
                traffic_retention_1d_days:
                  type: integer
                  minimum: 1
                is_geoip_enabled:
                  type: boolean
                geoip_refresh_days:
                  type: integer
                  minimum: 1
                geoip_maxmind_license_key:
