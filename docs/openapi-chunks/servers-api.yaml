        - Servers
      summary: 'Get server proxy'
      description: 'Get proxy settings for a server owned by the authenticated team. The raw proxy configuration is only returned when the token has `read:sensitive` (or `root`) and the user is a team admin/owner, and only when already stored in the database (no remote fetch).'
      operationId: get-server-proxy
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Server proxy settings.'
          content:
            application/json:
              schema:
                properties:
                  proxy_type: { type: [string, 'null'], example: TRAEFIK }
                  status: { type: [string, 'null'], example: running }
                  redirect_enabled: { type: boolean, example: true }
                  redirect_url: { type: [string, 'null'], example: 'https://example.com' }
                  proxy_error_page: { type: [string, 'null'] }
                  generate_exact_labels: { type: boolean, example: false }
                  traefik_certificate_resolver: { description: 'Traefik certificate resolver for generated HTTPS routers. Null when the proxy uses its own certificates.', type: [string, 'null'], example: letsencrypt }
                  configuration: { description: 'Docker Compose proxy configuration when stored in the database. Only present with read:sensitive.', type: [string, 'null'] }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - Servers
      summary: 'Update server proxy'
      description: 'Update proxy redirect settings, exact labels generation, the Traefik certificate resolver, and optionally the proxy type for a team-owned server. Changing proxy_type needs a token with the `write` and `deploy` permissions.'
      operationId: update-server-proxy
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                redirect_enabled:
                  type: boolean
                redirect_url:
                  description: 'Public http(s) redirect URL, or null to clear.'
                  type: [string, 'null']
                proxy_error_page:
                  description: 'Custom HTML error page that the proxy shows for unknown hosts (when redirect_url is empty) and for resources in maintenance mode. Null restores the default page.'
                  type: [string, 'null']
                generate_exact_labels:
                  type: boolean
                traefik_certificate_resolver:
                  description: 'Traefik certificate resolver for generated HTTPS routers (letters, digits, _ and -). Null or empty to use your own certificates. Redeploy resources to apply.'
                  type: [string, 'null']
                proxy_type:
                  description: 'Proxy type (case-insensitive). Changing it starts the new proxy on the server and needs the deploy permission.'
                  type: string
                  enum: [traefik, caddy, nginx, none]
              type: object
      responses:
        '200':
          description: 'Proxy settings updated.'
          content:
            application/json:
              schema:
                properties:
                  proxy_type: { type: [string, 'null'] }
                  status: { type: [string, 'null'] }
                  redirect_enabled: { type: boolean }
                  redirect_url: { type: [string, 'null'] }
                  proxy_error_page: { type: [string, 'null'] }
                  generate_exact_labels: { type: boolean }
                  traefik_certificate_resolver: { type: [string, 'null'] }
                  configuration: { type: [string, 'null'] }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '403':
          description: 'The token needs the deploy permission to change the proxy type.'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
