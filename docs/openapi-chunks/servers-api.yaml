                sentinel_metrics_history_days:
                  type: integer
                  minimum: 1
                sentinel_push_interval_seconds:
                  type: integer
                  minimum: 10
                sentinel_custom_url:
                  type: [string, 'null']
              type: object
      responses:
        '200':
          description: 'Updated Sentinel settings.'
