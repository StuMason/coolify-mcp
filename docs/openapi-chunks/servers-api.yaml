                  type: string
                  example: ghcr.io
                username:
                  type: string
                  example: octocat
                password:
                  description: 'Password or access token. Never returned.'
                  type: string
              type: object
      responses:
        '200':
          description: 'Logged in.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Logged in to ghcr.io.' }
