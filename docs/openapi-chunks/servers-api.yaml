openapi: 3.1.0
info:
  title: Coolify
  version: '0.1'
paths:
  /servers:
    get:
      tags:
        - Servers
      summary: List
      description: 'List all servers.'
      operationId: list-servers
      responses:
        '200':
          description: 'Get all servers.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Servers
      summary: Create
      description: 'Create Server.'
      operationId: create-server
      requestBody:
        description: 'Server created.'
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  example: 'My Server'
                  description: 'The name of the server.'
                description:
                  type: string
                  example: 'My Server Description'
                  description: 'The description of the server.'
                ip:
                  type: string
                  example: 127.0.0.1
                  description: 'The IP of the server.'
                port:
                  type: integer
                  example: 22
                  description: 'The port of the server.'
                user:
                  type: string
                  example: root
                  description: 'The user of the server.'
                private_key_uuid:
                  type: string
                  example: og888os
                  description: 'The UUID of the private key.'
                is_build_server:
                  type: boolean
                  example: false
                  description: 'Is build server.'
                instant_validate:
                  type: boolean
                  example: false
                  description: 'Instant validate.'
                proxy_type:
                  type: string
                  enum: [traefik, caddy, none]
                  example: traefik
                  description: 'The proxy type.'
              type: object
      responses:
        '201':
          description: 'Server created.'
          content:
            application/json:
              schema:
                properties:
                  uuid: { type: string, example: og888os, description: 'The UUID of the server.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/servers/{server_uuid}/destinations':
    get:
      tags:
        - Destinations
      summary: 'List destinations by server'
      description: 'List Docker network destinations attached to a server owned by the authenticated team.'
      operationId: list-server-destinations
      parameters:
        -
          name: server_uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Destinations attached to the server.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destination'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Destinations
      summary: 'Create destination'
      description: 'Create a Docker network destination on a server owned by the authenticated team.'
      operationId: create-server-destination
      parameters:
        -
          name: server_uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - network
              properties:
                name:
                  type: string
                  maxLength: 255
                network:
                  type: string
                  maxLength: 255
                  pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'
                type:
                  type: string
                  enum: [standalone, swarm]
              type: object
      responses:
        '201':
          description: 'Destination created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: 'A destination with this network already exists.'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}':
    get:
      tags:
        - Servers
      summary: Get
      description: 'Get server by UUID.'
      operationId: get-server-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: "Server's UUID"
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Get server by UUID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - Servers
      summary: Delete
      description: 'Delete server by UUID.'
      operationId: delete-server-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'UUID of the server.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Server deleted.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Server deleted.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - Servers
      summary: Update
      description: 'Update Server.'
      operationId: update-server-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      requestBody:
        description: 'Server updated.'
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  description: 'The name of the server.'
                description:
                  type: string
                  description: 'The description of the server.'
                ip:
                  type: string
                  description: 'The IP of the server.'
                port:
                  type: integer
                  description: 'The port of the server.'
                user:
                  type: string
                  description: 'The user of the server.'
                private_key_uuid:
                  type: string
                  description: 'The UUID of the private key.'
                is_build_server:
                  type: boolean
                  description: 'Is build server.'
                instant_validate:
                  type: boolean
                  description: 'Instant validate.'
                proxy_type:
                  type: string
                  enum: [traefik, caddy, none]
                  description: 'The proxy type.'
                concurrent_builds:
                  type: integer
                  description: 'Number of concurrent builds.'
                dynamic_timeout:
                  type: integer
                  description: 'Deployment timeout in seconds.'
                deployment_queue_limit:
                  type: integer
                  description: 'Maximum number of queued deployments.'
                server_disk_usage_notification_threshold:
                  type: integer
                  description: 'Server disk usage notification threshold (%).'
                server_disk_usage_check_frequency:
                  type: string
                  description: 'Cron expression for disk usage check frequency.'
                connection_timeout:
                  type: integer
                  description: 'SSH connection timeout in seconds (1-300). Default: 10.'
              type: object
      responses:
        '201':
          description: 'Server updated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/claim':
    post:
      tags:
        - Servers
      summary: 'Claim imported server'
      description: 'Claim a managed host for this instance: write ownership file and rebind Sentinel.'
      operationId: claim-server
      parameters:
        -
          name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                write_remote:
                  type: boolean
                  default: true
                rebind_sentinel:
                  type: boolean
                  default: true
              type: object
      responses:
        '200':
          description: 'Claim result'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/cloudflare-tunnel':
    get:
      tags:
        - Servers
      summary: 'Get Cloudflare Tunnel settings'
      description: 'Get Cloudflare Tunnel settings for a server owned by the authenticated team.'
      operationId: get-server-cloudflare-tunnel
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Cloudflare Tunnel settings.'
          content:
            application/json:
              schema:
                properties:
                  is_cloudflare_tunnel: { type: boolean }
                  ip: { type: string }
                  ip_previous: { type: [string, 'null'] }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - Servers
      summary: 'Update Cloudflare Tunnel settings'
      description: 'Update stored Cloudflare Tunnel settings for a server. Does not run remote cloudflared configuration; use enable/disable for the manual UI actions.'
      operationId: update-server-cloudflare-tunnel
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                is_cloudflare_tunnel:
                  type: boolean
              type: object
      responses:
        '200':
          description: 'Updated Cloudflare Tunnel settings.'
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/cloudflare-tunnel/disable':
    post:
      tags:
        - Servers
      summary: 'Disable Cloudflare Tunnel'
      description: 'Mark Cloudflare Tunnel as disabled and restore ip_previous when available. Does not remove the remote cloudflared container.'
      operationId: disable-server-cloudflare-tunnel
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Cloudflare Tunnel disabled.'
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/cloudflare-tunnel/enable':
    post:
      tags:
        - Servers
      summary: 'Enable Cloudflare Tunnel (manual)'
      description: 'Manually mark Cloudflare Tunnel as enabled for a server (matches UI manual enable). Does not deploy cloudflared remotely.'
      operationId: enable-server-cloudflare-tunnel
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Cloudflare Tunnel enabled.'
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/docker-cleanup':
    get:
      tags:
        - Servers
      summary: 'Get Docker cleanup settings'
      description: 'Get Docker cleanup settings for a server owned by the authenticated team.'
      operationId: get-server-docker-cleanup
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Docker cleanup settings.'
          content:
            application/json:
              schema:
                properties:
                  docker_cleanup_frequency: { type: string }
                  docker_cleanup_threshold: { type: integer }
                  force_docker_cleanup: { type: boolean }
                  delete_unused_volumes: { type: boolean }
                  delete_unused_networks: { type: boolean }
                  disable_application_image_retention: { type: boolean }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - Servers
      summary: 'Update Docker cleanup settings'
      description: 'Update Docker cleanup settings for a server owned by the authenticated team.'
      operationId: update-server-docker-cleanup
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                docker_cleanup_frequency:
                  description: 'Cron / human frequency expression.'
                  type: string
                docker_cleanup_threshold:
                  type: integer
                  maximum: 99
                  minimum: 1
                force_docker_cleanup:
                  type: boolean
                delete_unused_volumes:
                  type: boolean
                delete_unused_networks:
                  type: boolean
                disable_application_image_retention:
                  type: boolean
              type: object
      responses:
        '200':
          description: 'Updated Docker cleanup settings.'
          content:
            application/json:
              schema:
                properties:
                  docker_cleanup_frequency: { type: string }
                  docker_cleanup_threshold: { type: integer }
                  force_docker_cleanup: { type: boolean }
                  delete_unused_volumes: { type: boolean }
                  delete_unused_networks: { type: boolean }
                  disable_application_image_retention: { type: boolean }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/docker-cleanup/executions':
    get:
      tags:
        - Servers
      summary: 'List Docker cleanup executions'
      description: 'List recent Docker cleanup execution logs for a server owned by the authenticated team.'
      operationId: list-server-docker-cleanup-executions
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Recent Docker cleanup executions.'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { uuid: { type: string }, status: { type: string }, message: { type: [string, 'null'] }, finished_at: { type: [string, 'null'] }, created_at: { type: string }, updated_at: { type: string } }
                  type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/docker-cleanup/run':
    post:
      tags:
        - Servers
      summary: 'Run Docker cleanup'
      description: 'Dispatch a manual Docker cleanup job for a server owned by the authenticated team.'
      operationId: run-server-docker-cleanup
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                delete_unused_volumes:
                  type: boolean
                delete_unused_networks:
                  type: boolean
              type: object
      responses:
        '200':
          description: 'Docker cleanup job dispatched.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Manual cleanup job started.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/domains':
    get:
      tags:
        - Servers
      summary: Domains
      description: 'Get domains by server.'
      operationId: get-domains-by-server-uuid
      parameters:
        -
          name: uuid
          in: path
          description: "Server's UUID"
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Get domains by server'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { ip: { type: string }, domains: { type: array, items: { type: string } } }
                  type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/envs':
    get:
      tags:
        - 'Shared Environment Variables'
      summary: 'List Server Shared Envs'
      description: 'List shared environment variables for a server (type=server).'
      operationId: list-server-shared-envs
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Server shared environment variables.'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - 'Shared Environment Variables'
      summary: 'Create Server Shared Env'
      description: 'Create a shared environment variable for a server (type=server).'
      operationId: create-server-shared-env
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      responses:
        '201':
          description: 'Environment variable created.'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: 'Environment variable already exists.'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/envs/{env_id}':
    delete:
      tags:
        - 'Shared Environment Variables'
      summary: 'Delete Server Shared Env'
      description: 'Delete a server shared environment variable by id.'
      operationId: delete-server-shared-env
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
        -
          name: env_id
          in: path
          description: 'Shared env id (integer).'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Environment variable deleted.'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - 'Shared Environment Variables'
      summary: 'Update Server Shared Env'
      description: 'Update a server shared environment variable by id.'
      operationId: update-server-shared-env
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
        -
          name: env_id
          in: path
          description: 'Shared env id (integer).'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Environment variable updated.'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/export':
    get:
      tags:
        - Servers
      summary: 'Export server transfer bundle'
      description: 'Export a server and all resources hosted on it as a versioned transfer bundle for moving between Coolify instances. Requires read:sensitive.'
      operationId: export-server-transfer-bundle
      parameters:
        -
          name: uuid
          in: path
          required: true
          schema:
            type: string
        -
          name: encrypt
          in: query
          description: 'If true and passphrase is provided, return an encrypted envelope.'
          required: false
          schema:
            type: boolean
        -
          name: passphrase
          in: query
          description: 'Passphrase used when encrypt=true.'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 'Transfer bundle'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'Missing sensitive permission'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/export/mailbox':
    post:
      tags:
        - Servers
      summary: 'Write transfer bundle to server mailbox'
      description: 'Write an export bundle to /data/coolify/exports on the managed host for air-gapped import.'
      operationId: export-server-transfer-mailbox
      parameters:
        -
          name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                passphrase:
                  type: [string, 'null']
              type: object
      responses:
        '200':
          description: 'Mailbox write result'
        '403':
          description: 'Missing sensitive permission'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/log-drains':
    get:
      tags:
        - Servers
      summary: 'Get log drain settings'
      description: 'Get log drain settings for a server owned by the authenticated team. Sensitive fields require the read:sensitive or root token ability.'
      operationId: get-server-log-drains
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Log drain settings.'
          content:
            application/json:
              schema:
                properties:
                  is_logdrain_newrelic_enabled: { type: boolean }
                  logdrain_newrelic_license_key: { description: 'Only present with read:sensitive.', type: string }
                  logdrain_newrelic_base_uri: { type: [string, 'null'] }
                  is_logdrain_axiom_enabled: { type: boolean }
                  logdrain_axiom_dataset_name: { type: [string, 'null'] }
                  logdrain_axiom_api_key: { description: 'Only present with read:sensitive.', type: string }
                  is_logdrain_custom_enabled: { type: boolean }
                  logdrain_custom_config: { description: 'Only present with read:sensitive.', type: string }
                  logdrain_custom_config_parser: { description: 'Only present with read:sensitive.', type: string }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - Servers
      summary: 'Update log drain settings'
      description: 'Update New Relic, Axiom, or custom log drain settings for a server owned by the authenticated team.'
      operationId: update-server-log-drains
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                is_logdrain_newrelic_enabled:
                  type: boolean
                logdrain_newrelic_license_key:
                  type: string
                logdrain_newrelic_base_uri:
                  type: string
                is_logdrain_axiom_enabled:
                  type: boolean
                logdrain_axiom_dataset_name:
                  type: string
                logdrain_axiom_api_key:
                  type: string
                is_logdrain_custom_enabled:
                  type: boolean
                logdrain_custom_config:
                  type: string
                logdrain_custom_config_parser:
                  type: string
              type: object
      responses:
        '200':
          description: 'Updated log drain settings.'
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/migrate':
    post:
      tags:
        - Servers
      summary: 'Migrate server to another Coolify instance'
      description: 'One-shot handoff: export this server, import+claim on the target instance (using the provided token), then disable automations here. Requires read:sensitive and write.'
      operationId: migrate-server-between-instances
      parameters:
        -
          name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - target_url
                - target_token
              properties:
                target_url:
                  type: string
                  example: 'https://coolify-b.example.com'
                target_token:
                  description: 'API token on the target instance (root or write)'
                  type: string
                write_remote:
                  type: boolean
                  default: false
                rebind_sentinel:
                  type: boolean
                  default: true
                preserve_uuids:
                  type: boolean
                  default: true
                adopt_mode:
                  type: boolean
                  default: true
              type: object
      responses:
        '200':
          description: Migrated
        '403':
          description: 'Missing sensitive permission'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: 'Validation or remote import failed'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/proxy':
    get:
      tags:
        - Servers
      summary: 'Get server proxy'
      description: 'Get proxy settings for a server owned by the authenticated team. The raw proxy configuration is only returned when the token has `read:sensitive` (or `root`) and the user is a team admin/owner, and only when already stored in the database (no remote fetch).'
      operationId: get-server-proxy
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Server proxy settings.'
          content:
            application/json:
              schema:
                properties:
                  proxy_type: { type: [string, 'null'], example: TRAEFIK }
                  status: { type: [string, 'null'], example: running }
                  redirect_enabled: { type: boolean, example: true }
                  redirect_url: { type: [string, 'null'], example: 'https://example.com' }
                  generate_exact_labels: { type: boolean, example: false }
                  configuration: { description: 'Docker Compose proxy configuration when stored in the database. Only present with read:sensitive.', type: [string, 'null'] }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - Servers
      summary: 'Update server proxy'
      description: 'Update proxy redirect settings, exact labels generation, and optionally the proxy type for a team-owned server.'
      operationId: update-server-proxy
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                redirect_enabled:
                  type: boolean
                redirect_url:
                  description: 'Public http(s) redirect URL, or null to clear.'
                  type: [string, 'null']
                generate_exact_labels:
                  type: boolean
                proxy_type:
                  description: 'Proxy type (case-insensitive).'
                  type: string
                  enum: [traefik, caddy, nginx, none]
              type: object
      responses:
        '200':
          description: 'Proxy settings updated.'
          content:
            application/json:
              schema:
                properties:
                  proxy_type: { type: [string, 'null'] }
                  status: { type: [string, 'null'] }
                  redirect_enabled: { type: boolean }
                  redirect_url: { type: [string, 'null'] }
                  generate_exact_labels: { type: boolean }
                  configuration: { type: [string, 'null'] }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/proxy/configuration':
    put:
      tags:
        - Servers
      summary: 'Save server proxy configuration'
      description: 'Save the raw proxy Docker Compose configuration for a team-owned server. Multi-line configuration must be base64 encoded (same pattern as other compose payloads).'
      operationId: save-server-proxy-configuration
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - configuration
              properties:
                configuration:
                  description: 'Proxy docker-compose YAML. Prefer base64 encoding for multi-line content.'
                  type: string
              type: object
      responses:
        '200':
          description: 'Proxy configuration saved.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Proxy configuration saved.' }
                  proxy_type: { type: [string, 'null'] }
                  status: { type: [string, 'null'] }
                  redirect_enabled: { type: boolean }
                  redirect_url: { type: [string, 'null'] }
                  generate_exact_labels: { type: boolean }
                  configuration: { type: [string, 'null'] }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/proxy/restart':
    post:
      tags:
        - Servers
      summary: 'Restart server proxy'
      description: 'Queue a proxy restart for a team-owned server.'
