          application/json:
            schema:
              properties:
                is_sentinel_enabled:
                  type: boolean
                is_metrics_enabled:
                  type: boolean
                is_sentinel_debug_enabled:
                  type: boolean
                sentinel_token:
                  type: string
                sentinel_metrics_refresh_rate_seconds:
