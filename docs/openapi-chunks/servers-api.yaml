                  type: boolean
                geoip_refresh_days:
                  type: integer
                  minimum: 1
                geoip_maxmind_license_key:
                  type: [string, 'null']
                traffic_ip_mode:
                  description: 'How Sentinel stores client IPs: full, anonymized (IPv4 /24, IPv6 /48), or off.'
                  type: string
                  enum: [full, anonymized, 'off']
              type: object
      responses:
        '200':
          description: 'Updated Sentinel settings.'
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '403':
          description: 'The token needs the write and deploy permissions.'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/transfer':
    get:
      tags:
        - Servers
      summary: 'Get server transfer status'
      description: 'Show the transfer state of a server on this instance: the import/claim state (transfer) and the state of a running or finished transfer to another instance (migration).'
      operationId: get-server-transfer-status
      parameters:
        -
          name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Transfer status'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/transfer/complete':
    post:
      tags:
        - Servers
      summary: 'Mark server transferred'
      description: 'Source-instance recovery step: disable automations here when the target already manages the server but the transfer could not finish on this instance.'
      operationId: complete-server-transfer
      parameters:
        -
          name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                export_id:
                  type: [string, 'null']
                target_instance_url:
                  type: [string, 'null']
              type: object
      responses:
        '200':
          description: 'Marked transferred'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
  '/servers/{uuid}/validate':
    post:
      tags:
        - Servers
      summary: Validate
      description: 'Validate server by UUID. With install=true, needs a token with the write and deploy permissions.'
      operationId: validate-server-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                install:
                  description: 'Install missing prerequisites and Docker, then start the proxy. This can restart the Docker daemon. Needs the deploy permission.'
                  type: boolean
                  default: false
              type: object
      responses:
        '403':
          description: 'The token needs the deploy permission to install the server.'
        '201':
          description: 'Server validation started.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Validation started.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  /servers/digitalocean:
    post:
      tags:
        - DigitalOcean
      summary: 'Create a server on DigitalOcean'
      description: 'Create a DigitalOcean droplet and link it as a Coolify server. A cloud-init script or extra SSH key IDs need a token with the deploy permission.'
      operationId: create-digitalocean-server
      responses:
        '201':
          description: 'DigitalOcean droplet created and linked to a Coolify server.'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'The token needs the deploy permission for a cloud-init script or extra SSH keys.'
        '422':
          description: 'Validation failed.'
        '429':
          description: 'DigitalOcean rate limit exceeded.'
        '502':
          $ref: '#/components/responses/502'
      security:
        -
          bearerAuth: []
  /servers/hetzner:
    post:
      tags:
        - Hetzner
      summary: 'Create Hetzner Server'
      description: 'Create a new server on Hetzner and register it in Coolify. A cloud-init script or extra SSH key IDs need a token with the deploy permission.'
      operationId: create-hetzner-server
      requestBody:
        description: 'Hetzner server creation parameters'
        required: true
        content:
          application/json:
            schema:
              required:
                - location
                - server_type
                - image
                - private_key_uuid
              properties:
                cloud_provider_token_uuid:
                  type: string
                  example: abc123
                  description: 'Cloud provider token UUID. Required if cloud_provider_token_id is not provided.'
                cloud_provider_token_id:
                  type: string
                  example: abc123
                  description: 'Deprecated: Use cloud_provider_token_uuid instead. Cloud provider token UUID.'
                  deprecated: true
                location:
                  type: string
                  example: nbg1
                  description: 'Hetzner location name'
                server_type:
                  type: string
                  example: cx11
                  description: 'Hetzner server type name'
                image:
                  type: integer
                  example: 15512617
                  description: 'Hetzner image ID'
                name:
                  type: string
                  example: my-server
                  description: 'Server name (auto-generated if not provided)'
                private_key_uuid:
                  type: string
                  example: xyz789
                  description: 'Private key UUID'
                enable_ipv4:
                  type: boolean
                  example: true
                  description: 'Enable IPv4 (default: true)'
                enable_ipv6:
                  type: boolean
                  example: true
                  description: 'Enable IPv6 (default: true)'
                enable_backups:
                  type: boolean
                  example: false
                  description: 'Enable Hetzner server backups after creation (adds 20% to the monthly server fee)'
                hetzner_ssh_key_ids:
                  type: array
                  items: { type: integer }
                  description: 'Additional Hetzner SSH key IDs. Needs a token with the deploy permission.'
                hetzner_firewall_ids:
                  type: array
                  items: { type: integer }
                  description: 'Existing Hetzner firewall IDs to apply during server creation'
                hetzner_network_ids:
                  type: array
                  items: { type: integer }
                  description: 'Existing Hetzner network IDs to attach during server creation'
                cloud_init_script:
                  type: string
                  description: 'Cloud-init YAML script (optional). Needs a token with the deploy permission.'
                instant_validate:
                  type: boolean
                  example: false
                  description: 'Validate the server and install Docker when it is running. Defaults to true for tokens with the deploy permission, and needs that permission.'
              type: object
      responses:
        '201':
          description: 'Hetzner server created.'
          content:
            application/json:
              schema:
                properties:
                  uuid: { type: string, example: og888os, description: 'The UUID of the server.' }
                  hetzner_server_id: { type: integer, description: 'The Hetzner server ID.' }
                  ip: { type: string, description: 'The server IP address.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '403':
          description: 'The token needs the deploy permission for a cloud-init script or extra SSH keys.'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '502':
          $ref: '#/components/responses/502'
      security:
        -
          bearerAuth: []
  /servers/hostinger:
    post:
      tags:
        - Hostinger
      summary: 'Purchase a Hostinger VPS and create a linked server'
      operationId: create-hostinger-server
      responses:
        '201':
          description: 'Hostinger VPS purchased and linked to a Coolify server.'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'The token needs the deploy permission for a post-install script or extra SSH keys.'
        '422':
          description: 'Validation failed.'
        '429':
          description: 'Hostinger rate limit exceeded.'
      security:
        -
          bearerAuth: []
  /servers/import:
    post:
      tags:
        - Servers
      summary: 'Import server transfer bundle'
      description: 'Import a server transfer bundle into this Coolify instance (adopt mode by default). This instance then manages the server, and Sentinel reports to it. Needs a token with the write and deploy permissions.'
      operationId: import-server-transfer-bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                bundle:
                  description: 'Transfer bundle'
                  type: object
                dry_run:
                  type: boolean
                  default: false
                preserve_uuids:
                  type: boolean
                  default: true
                adopt_mode:
                  description: 'Import without forcing redeploy; keep statuses for adoption'
                  type: boolean
                  default: true
              type: object
      responses:
        '200':
          description: 'Dry-run result'
        '201':
          description: Imported
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'The token needs the write and deploy permissions.'
        '422':
          description: 'Validation failed'
      security:
        -
          bearerAuth: []
  /servers/import/check:
    get:
      tags:
        - Servers
      summary: 'Check server import'
      description: 'Check that this instance can import a server, before the source instance starts the transfer. It checks the token, the bundle version, the server limit, servers with the same UUID or IP, and that this instance can reach the SSH port of the server.'
      operationId: check-server-import
      parameters:
        -
          name: server_uuid
          in: query
          required: true
          schema:
            type: string
        -
          name: ip
          in: query
          required: true
          schema:
            type: string
        -
          name: port
          in: query
          required: false
          schema:
            type: integer
            default: 22
        -
          name: schema_version
          in: query
          required: false
          schema:
            type: integer
        -
          name: 'system_github_apps[]'
          in: query
          description: 'UUIDs of system-wide GitHub Apps that the server uses. The response lists the ones this instance does not have.'
          required: false
          schema:
            type: array
            items:
              type: string
        -
          name: 'system_gitlab_apps[]'
          in: query
          description: 'UUIDs of system-wide GitLab Apps that the server uses. The response lists the ones this instance does not have.'
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: 'The server can be imported. Lists every check with its result.'
        '401':
          $ref: '#/components/responses/401'
        '422':
          description: 'One or more checks failed. Lists every check with its result.'
      security:
        -
          bearerAuth: []
  /servers/vultr:
    post:
      tags:
        - Vultr
      summary: 'Create Vultr Server'
      description: 'Create a Vultr instance and link it as a Coolify server. A cloud-init script or extra SSH key IDs need a token with the deploy permission.'
      operationId: create-vultr-server
      responses:
        '201':
          description: 'Vultr server created.'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'The token needs the deploy permission for a cloud-init script or extra SSH keys.'
        '422':
          description: 'Validation failed.'
        '429':
          description: 'Vultr API rate limit exceeded.'
        '502':
          $ref: '#/components/responses/502'
      security:
        -
          bearerAuth: []
