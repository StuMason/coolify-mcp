  /servers/hetzner:
    post:
      tags:
        - Hetzner
      summary: 'Create Hetzner Server'
      description: 'Create a new server on Hetzner and register it in Coolify.'
      operationId: create-hetzner-server
      requestBody:
        description: 'Hetzner server creation parameters'
        required: true
        content:
          application/json:
            schema:
              required:
                - location
                - server_type
                - image
                - private_key_uuid
              properties:
                cloud_provider_token_uuid:
                  type: string
                  example: abc123
                  description: 'Cloud provider token UUID. Required if cloud_provider_token_id is not provided.'
                cloud_provider_token_id:
                  type: string
                  example: abc123
                  description: 'Deprecated: Use cloud_provider_token_uuid instead. Cloud provider token UUID.'
                  deprecated: true
                location:
                  type: string
                  example: nbg1
                  description: 'Hetzner location name'
                server_type:
                  type: string
                  example: cx11
                  description: 'Hetzner server type name'
                image:
                  type: integer
                  example: 15512617
                  description: 'Hetzner image ID'
                name:
                  type: string
                  example: my-server
                  description: 'Server name (auto-generated if not provided)'
                private_key_uuid:
                  type: string
                  example: xyz789
                  description: 'Private key UUID'
                enable_ipv4:
                  type: boolean
                  example: true
                  description: 'Enable IPv4 (default: true)'
                enable_ipv6:
                  type: boolean
                  example: true
                  description: 'Enable IPv6 (default: true)'
                enable_backups:
                  type: boolean
                  example: false
                  description: 'Enable Hetzner server backups after creation (adds 20% to the monthly server fee)'
                hetzner_ssh_key_ids:
                  type: array
                  items: { type: integer }
                  description: 'Additional Hetzner SSH key IDs'
                hetzner_firewall_ids:
                  type: array
                  items: { type: integer }
                  description: 'Existing Hetzner firewall IDs to apply during server creation'
                hetzner_network_ids:
                  type: array
                  items: { type: integer }
                  description: 'Existing Hetzner network IDs to attach during server creation'
                cloud_init_script:
                  type: string
                  description: 'Cloud-init YAML script (optional)'
                instant_validate:
                  type: boolean
                  example: false
                  description: 'Validate server immediately after creation'
              type: object
      responses:
        '201':
          description: 'Hetzner server created.'
          content:
            application/json:
              schema:
                properties:
                  uuid: { type: string, example: og888os, description: 'The UUID of the server.' }
                  hetzner_server_id: { type: integer, description: 'The Hetzner server ID.' }
                  ip: { type: string, description: 'The server IP address.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      security:
        -
          bearerAuth: []
  /servers/import:
    post:
      tags:
        - Servers
      summary: 'Import server transfer bundle'
      description: 'Import a server transfer bundle into this Coolify instance (adopt mode by default).'
      operationId: import-server-transfer-bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                bundle:
                  description: 'Plain or encrypted transfer bundle'
                  type: object
                passphrase:
                  type: [string, 'null']
                dry_run:
                  type: boolean
                  default: false
                preserve_uuids:
                  type: boolean
                  default: true
                adopt_mode:
                  description: 'Import without forcing redeploy; keep statuses for adoption'
                  type: boolean
                  default: true
                claim:
                  description: 'Automatically claim the host for this instance after import'
                  type: boolean
                  default: true
                write_remote:
                  description: 'When claiming, write ownership file on the host via SSH'
                  type: boolean
                  default: false
                rebind_sentinel:
                  description: 'When claiming, rebind Sentinel to this instance'
                  type: boolean
                  default: true
              type: object
      responses:
        '200':
          description: 'Dry-run result'
        '201':
          description: Imported
        '401':
          $ref: '#/components/responses/401'
        '422':
          description: 'Validation failed'
      security:
        -
          bearerAuth: []
