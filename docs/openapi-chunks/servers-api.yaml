                  image_scan_syft_timeout: { description: 'Time limit of one Syft run (package list of an image), in seconds.', type: integer, enum: [300, 600, 1200, 1800, 3600] }
                  image_scan_grype_timeout: { description: 'Time limit of one Grype run (vulnerability match), in seconds.', type: integer, enum: [300, 600, 1200, 1800, 3600] }
