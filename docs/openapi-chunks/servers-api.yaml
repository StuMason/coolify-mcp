              schema:
                properties:
                  is_sentinel_enabled: { type: boolean }
                  is_metrics_enabled: { type: boolean }
                  is_sentinel_debug_enabled: { type: boolean }
                  sentinel_token: { description: 'Only present with read:sensitive.', type: string }
                  sentinel_metrics_refresh_rate_seconds: { type: integer }
                  sentinel_metrics_history_days: { type: integer }
                  sentinel_push_interval_seconds: { type: integer }
                  sentinel_custom_url: { description: 'Only present with read:sensitive.', type: string }
                  sentinel_updated_at: { type: [string, 'null'] }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - Servers
      summary: 'Update Sentinel settings'
      description: 'Update Sentinel settings for a server owned by the authenticated team. Changing token/metrics timing fields may restart Sentinel.'
      operationId: update-server-sentinel
      parameters:
        -
          name: uuid
          in: path
          description: 'Server UUID'
          required: true
          schema:
            type: string
