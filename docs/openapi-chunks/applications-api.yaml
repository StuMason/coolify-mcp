      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - type
                - mount_path
              properties:
                type:
                  type: string
                  enum: [persistent, file]
                  description: 'The type of storage.'
                name:
                  type: string
                  description: 'Volume name (persistent only, required for persistent).'
                mount_path:
                  type: string
                  description: 'The container mount path.'
                content:
                  type: string
                  nullable: true
                  description: 'File content (file only, optional). Needs the deploy ability when set.'
                is_directory:
                  type: boolean
                  description: 'Whether this is a directory mount (file only, default false).'
                fs_path:
                  type: string
                  description: 'Host path. Required for directory mounts and host file mounts. Optional for file mounts with content (default: inside the resource directory). An absolute path can be anywhere on the host; a relative path is inside the resource directory. A directory or file mount outside the resource directory needs a token with the deploy permission. Coolify never deletes a path outside the resource directory.'
              type: object
              additionalProperties: false
