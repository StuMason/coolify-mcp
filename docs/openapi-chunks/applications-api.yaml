    patch:
      tags:
        - Applications
      summary: 'Update Storage'
      description: 'Update a persistent storage or file storage by application UUID. Changed file content is saved right away and written to the server in the background, so a failed write does not change the response.'
      operationId: update-storage-by-application-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'UUID of the application.'
          required: true
          schema:
            type: string
      requestBody:
        description: 'Storage updated. For read-only storages (from docker-compose or services), only is_preview_suffix_enabled can be updated.'
        required: true
        content:
          application/json:
            schema:
              required:
                - type
              properties:
                uuid:
                  type: string
                  description: 'The UUID of the storage (preferred).'
                id:
                  type: integer
                  description: 'The ID of the storage (deprecated, use uuid instead).'
                type:
                  type: string
                  enum: [persistent, file]
                  description: 'The type of storage: persistent or file.'
                is_preview_suffix_enabled:
                  type: boolean
                  description: 'Whether to add -pr-N suffix for preview deployments.'
                name:
                  type: string
                  description: 'The volume name (persistent only, not allowed for read-only storages).'
                mount_path:
                  type: string
                  description: 'The container mount path (not allowed for read-only storages).'
                content:
                  type: string
                  nullable: true
                  description: 'The file content (file only, not allowed for read-only storages). Changing the content needs the deploy permission.'
              type: object
              additionalProperties: false
      responses:
        '200':
          description: 'Storage updated.'
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '403':
