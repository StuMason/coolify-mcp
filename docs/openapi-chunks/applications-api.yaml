openapi: 3.1.0
info:
  title: Coolify
  version: '0.1'
paths:
  /applications:
    get:
      tags:
        - Applications
      summary: List
      description: 'List all applications.'
      operationId: list-applications
      parameters:
        -
          name: tag
          in: query
          description: 'Filter applications by tag name.'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 'Get all applications.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
      security:
        -
          bearerAuth: []
  '/applications/{uuid}':
    get:
      tags:
        - Applications
      summary: Get
      description: 'Get application by UUID.'
      operationId: get-application-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'UUID of the application.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Get application by UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - Applications
      summary: Delete
      description: 'Delete application by UUID. Needs a token with the write and deploy permissions.'
      operationId: delete-application-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'UUID of the application.'
          required: true
          schema:
            type: string
        -
          name: delete_configurations
          in: query
          description: 'Delete configurations.'
          required: false
          schema:
            type: boolean
            default: true
        -
          name: delete_volumes
          in: query
          description: 'Delete volumes.'
          required: false
          schema:
            type: boolean
            default: true
        -
          name: docker_cleanup
          in: query
          description: 'Run docker cleanup when the server disk usage is at or above its cleanup threshold. Skipped when a cleanup ran on the server in the last hour.'
          required: false
          schema:
            type: boolean
            default: true
        -
          name: delete_connected_networks
          in: query
          description: 'Delete connected networks.'
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: 'Application deleted.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Application deleted.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '403':
          description: 'The token needs the write and deploy permissions.'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - Applications
      summary: Update
      description: 'Update application by UUID.'
      operationId: update-application-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'UUID of the application.'
          required: true
          schema:
            type: string
      requestBody:
        description: 'Application updated.'
        required: true
        content:
          application/json:
            schema:
              properties:
                github_app_uuid:
                  type: string
                  description: 'The Github App UUID.'
                gitea_app_uuid:
                  type: string
                  description: 'The Gitea App UUID. The source must be connected. Do not send it together with github_app_uuid.'
                git_repository:
                  type: string
                  description: 'The git repository URL.'
                git_branch:
                  type: string
                  description: 'The git branch.'
                git_https_username:
                  type: string
                  nullable: true
                  description: 'Username for HTTPS access to a private repository on a custom Git host. Send null to remove it.'
                git_https_password:
                  type: string
                  nullable: true
                  description: 'Password or access token for HTTPS access to a private repository on a custom Git host. It is stored encrypted and never returned. Send null or an empty string to remove the credentials.'
                ports_exposes:
                  type: string
                  description: 'The ports to expose.'
                build_pack:
                  type: string
                  enum: [nixpacks, railpack, static, dockerfile, dockercompose]
                  description: 'The build pack type.'
                name:
                  type: string
                  description: 'The application name.'
                description:
                  type: string
                  description: 'The application description.'
                domains:
                  type: string
                  description: 'The application URLs in a comma-separated list.'
                noindex_domains:
                  type: array
                  items: { type: string }
                  description: 'The subset of the application domains served with an X-Robots-Tag: noindex, nofollow response header, keeping them out of search engines. Entries that are not among the application domains are ignored.'
                git_commit_sha:
                  type: string
                  description: 'The git commit SHA.'
                docker_registry_image_name:
                  type: string
                  description: 'The docker registry image name.'
                docker_registry_image_tag:
                  type: string
                  description: 'The docker registry image tag.'
                is_static:
                  type: boolean
                  description: 'The flag to indicate if the application is static.'
                is_spa:
                  type: boolean
                  description: 'The flag to indicate if the application is a single-page application (SPA). Only relevant when is_static is true.'
                is_auto_deploy_enabled:
                  type: boolean
                  description: 'The flag to indicate if auto-deploy is enabled on git push. Defaults to true.'
                is_force_https_enabled:
                  type: boolean
                  description: 'The flag to indicate if HTTPS is forced. Defaults to true.'
                is_preview_deployments_enabled:
                  type: boolean
                  description: 'Enable preview deployments for pull requests.'
                install_command:
                  type: string
                  description: 'The install command.'
                build_command:
                  type: string
                  description: 'The build command.'
                start_command:
                  type: string
                  description: 'The start command.'
                ports_mappings:
                  type: string
                  description: 'The ports mappings.'
                base_directory:
                  type: string
                  description: 'The base directory for all commands.'
                publish_directory:
                  type: string
                  description: 'The publish directory.'
                health_check_enabled:
                  type: boolean
                  description: 'Health check enabled.'
                health_check_path:
                  type: string
                  description: 'Health check path.'
                health_check_port:
                  type: string
                  nullable: true
                  description: 'Health check port.'
                health_check_host:
                  type: string
                  nullable: true
                  description: 'Health check host.'
                health_check_method:
                  type: string
                  description: 'Health check method.'
                health_check_return_code:
                  type: integer
                  description: 'Health check return code.'
                health_check_scheme:
                  type: string
                  description: 'Health check scheme.'
                health_check_response_text:
                  type: string
                  nullable: true
                  description: 'Health check response text.'
                health_check_interval:
                  type: integer
                  description: 'Health check interval in seconds.'
                health_check_timeout:
                  type: integer
                  description: 'Health check timeout in seconds.'
                health_check_retries:
                  type: integer
                  description: 'Health check retries count.'
                health_check_start_period:
                  type: integer
                  description: 'Health check start period in seconds.'
                limits_memory:
                  type: string
                  description: 'Memory limit.'
                limits_memory_swap:
                  type: string
                  description: 'Memory swap limit.'
                limits_memory_swappiness:
                  type: integer
                  description: 'Memory swappiness.'
                limits_memory_reservation:
                  type: string
                  description: 'Memory reservation.'
                limits_cpus:
                  type: string
                  description: 'CPU limit.'
                limits_cpuset:
                  type: string
                  nullable: true
                  description: 'CPU set.'
                limits_cpu_shares:
                  type: integer
                  description: 'CPU shares.'
                custom_labels:
                  type: string
                  description: 'Custom labels.'
                custom_docker_run_options:
                  type: string
                  description: 'Custom docker run options.'
                post_deployment_command:
                  type: string
                  description: 'Post deployment command.'
                post_deployment_command_container:
                  type: string
                  description: 'Post deployment command container.'
                pre_deployment_command:
                  type: string
                  description: 'Pre deployment command.'
                pre_deployment_command_container:
                  type: string
                  description: 'Pre deployment command container.'
                manual_webhook_secret_github:
                  type: string
                  description: 'Manual webhook secret for Github. Needs the deploy ability.'
                manual_webhook_secret_gitlab:
                  type: string
                  description: 'Manual webhook secret for Gitlab. Needs the deploy ability.'
                manual_webhook_secret_bitbucket:
                  type: string
                  description: 'Manual webhook secret for Bitbucket. Needs the deploy ability.'
                manual_webhook_secret_gitea:
                  type: string
                  description: 'Manual webhook secret for Gitea. Needs the deploy ability.'
                redirect:
                  type: string
                  nullable: true
                  description: 'How to set redirect with Traefik / Caddy. www<->non-www.'
                  enum: [www, non-www, both]
                instant_deploy:
                  type: boolean
                  description: 'The flag to indicate if the application should be deployed instantly.'
                dockerfile:
                  type: string
                  description: 'The Dockerfile content.'
                dockerfile_location:
                  type: string
                  description: 'The Dockerfile location in the repository.'
                dockerfile_target_build:
                  type: string
                  nullable: true
                  description: 'The Docker build target (stage) in the Dockerfile.'
                docker_compose_location:
                  type: string
                  description: 'The Docker Compose location.'
                docker_compose_custom_start_command:
                  type: string
                  description: 'The Docker Compose custom start command.'
                docker_compose_custom_build_command:
                  type: string
                  description: 'The Docker Compose custom build command.'
                docker_compose_domains:
                  type: array
                  description: 'Array of URLs to be applied to containers of a dockercompose application.'
                  items: { properties: { name: { type: string, description: 'The service name as defined in docker-compose.' }, domain: { type: string, description: 'Comma-separated list of URLs (e.g. "https://app.coolify.io,https://app2.coolify.io")' }, redirect: { type: string, nullable: true, description: 'Per-service www/non-www redirect for this compose service.', enum: [www, non-www, both] } }, type: object }
                watch_paths:
                  type: string
                  description: 'Watch path patterns, one per line (newline-separated). Commas do not separate patterns.'
                use_build_server:
                  type: boolean
                  nullable: true
                  description: 'Use build server.'
                use_build_secrets:
                  type: boolean
                  description: 'Use Docker Build Secrets for build-time environment variables.'
                http_basic_auth_hash_algorithm:
                  type: string
                  enum: [bcrypt, argon2id]
                  description: 'Hash algorithm for the HTTP Basic Authentication password. Argon2id needs the Caddy proxy, version 2.11 or newer.'
                http_basic_auth_bcrypt_cost:
                  type: integer
                  minimum: 4
                  maximum: 14
                  description: 'Bcrypt cost for the HTTP Basic Authentication password.'
                http_basic_auth_argon2id_memory_cost:
                  type: integer
                  minimum: 8192
                  maximum: 262144
                  description: 'Argon2id memory cost in KiB for the HTTP Basic Authentication password.'
                http_basic_auth_argon2id_time_cost:
                  type: integer
                  minimum: 1
                  maximum: 12
                  description: 'Argon2id time cost (iterations) for the HTTP Basic Authentication password.'
                is_git_submodules_enabled:
                  type: boolean
                  description: 'Clone Git submodules.'
                is_git_lfs_enabled:
                  type: boolean
                  description: 'Enable Git LFS.'
                is_git_shallow_clone_enabled:
                  type: boolean
                  description: 'Use a shallow Git clone.'
                is_auto_cancel_queued_deployments_enabled:
                  type: boolean
                  description: 'Cancel older queued webhook deployments when a newer push arrives. Default: true.'
                is_auto_cancel_building_deployments_enabled:
                  type: boolean
                  description: 'Also stop an older webhook deployment that is still building when a newer push arrives. A deployment that already started to replace containers always finishes. This also cancels queued webhook deployments. Default: false.'
                disable_build_cache:
                  type: boolean
                  description: 'Disable the build cache.'
                inject_build_args_to_dockerfile:
                  type: boolean
                  description: 'Inject build arguments into the Dockerfile build.'
                include_source_commit_in_build:
                  type: boolean
                  description: 'Include the source commit in the build.'
                include_network_hosts_in_build:
                  type: boolean
                  description: 'Add the containers of the destination network as build hosts.'
                is_env_sorting_enabled:
                  type: boolean
                  description: 'Sort environment variables.'
                redact_all_env_values_in_logs:
                  type: boolean
                  description: 'Redact all environment variable values in logs. When false, only locked (shown once) values are redacted. Requires team admin permissions.'
                include_coolify_default_variables:
                  type: boolean
                  default: true
                  description: 'Add the predefined COOLIFY_* variables (COOLIFY_URL, COOLIFY_FQDN, ...) to the environment. Requires team admin permissions. Redeploy to apply it.'
                is_pr_deployments_public_enabled:
                  type: boolean
                  description: 'Make pull request deployments public.'
                stop_grace_period:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 3600
                  description: 'Container stop grace period in seconds.'
                rolling_update_drain_seconds:
                  type: integer
                  minimum: 0
                  maximum: 300
                  description: 'Seconds to wait after the new container is healthy before old containers stop during a rolling update. 0 turns the wait off. Default: 5.'
                docker_images_to_keep:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: 'Number of Docker images to retain.'
                is_gzip_enabled:
                  type: boolean
                  description: 'Enable gzip compression.'
                is_stripprefix_enabled:
                  type: boolean
                  description: 'Enable path prefix stripping.'
                is_permanent_redirect_enabled:
                  type: boolean
                  description: 'Use permanent redirects (301/308) instead of temporary (302/307) for the HTTP to HTTPS and www redirects. Defaults to false.'
                traefik_certificate_resolver:
                  type: string
                  nullable: true
                  description: 'Traefik certificate resolver for this application. Null uses the server setting, "none" uses no resolver.'
                is_container_label_readonly_enabled:
                  type: boolean
                  default: true
                  description: 'Let Coolify manage the container labels. True regenerates custom_labels from domains, redirect, and proxy settings. False keeps custom_labels as you set them: domains, redirect, and basic auth changes then do not change the labels.'
                is_raw_compose_deployment_enabled:
                  type: boolean
                  description: 'Deploy the raw Docker Compose definition.'
                is_log_drain_enabled:
                  type: boolean
                  description: 'Enable log drain for the application.'
                is_gpu_enabled:
                  type: boolean
                  description: 'Enable GPU support.'
                gpu_driver:
                  type: string
                  nullable: true
                  description: 'GPU driver name.'
                gpu_count:
                  type: string
                  nullable: true
                  description: 'Number of GPUs to allocate.'
                gpu_device_ids:
                  type: string
                  nullable: true
                  description: 'Comma-separated GPU device IDs.'
                gpu_options:
                  type: string
                  nullable: true
                  description: 'Additional GPU options.'
                is_consistent_container_name_enabled:
                  type: boolean
                  description: 'Use a consistent container name across deployments.'
                is_image_scan_enabled:
                  type: boolean
                  description: 'Scan the images of the application for vulnerabilities. Needs image scanning on the server. Default true.'
                custom_internal_name:
                  type: string
                  nullable: true
                  description: 'Custom internal container name. Turns is_consistent_container_name_enabled on when that field is not sent; sending it as false together with a name returns 422.'
                custom_container_name_prefix:
                  type: string
                  nullable: true
                  description: 'Prefix for generated container names (prefix-20260908T141530). Slugified and unique across the instance.'
                preview_url_template:
                  type: string
                  description: 'Preview URL template.'
                max_restart_count:
                  type: integer
                  minimum: 0
                  description: 'Maximum container restart count before stopping.'
                connect_to_docker_network:
                  type: boolean
                  description: 'The flag to connect the service to the predefined Docker network.'
                force_domain_override:
                  type: boolean
                  description: 'Force domain usage even if conflicts are detected. Default is false.'
                is_container_label_escape_enabled:
                  type: boolean
                  default: true
                  description: 'Escape special characters in labels. By default, $ (and other chars) is escaped. So if you write $ in the labels, it will be saved as $$. If you want to use env variables inside the labels, turn this off.'
                is_preserve_repository_enabled:
                  type: boolean
                  description: 'Preserve git repository during application update. If false, the existing repository will be removed and replaced with the new one. If true, the existing repository will be kept and the new one will be ignored. Default is false.'
              type: object
      responses:
        '200':
          description: 'Application updated.'
          content:
            application/json:
              schema:
                properties:
                  uuid: { type: string }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'The token needs the deploy ability to set a manual webhook secret.'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: 'Domain conflicts detected.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Domain conflicts detected. Use force_domain_override=true to proceed.' }
                  warning: { type: string, example: 'Using the same domain for multiple resources can cause routing conflicts and unpredictable behavior.' }
                  conflicts: { type: array, items: { properties: { domain: { type: string, example: example.com }, resource_name: { type: string, example: 'My Application' }, resource_uuid: { type: string, nullable: true, example: abc123-def456 }, resource_type: { type: string, enum: [application, service, instance], example: application }, message: { type: string, example: "Domain example.com is already in use by application 'My Application'" } }, type: object } }
                type: object
      security:
        -
          bearerAuth: []
  '/applications/{uuid}/clone':
    post:
      tags:
        - Applications
      summary: Clone
      description: 'Clone an application to a destination owned by the authenticated team.'
      operationId: clone-application-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'UUID of the application.'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - destination_uuid
              properties:
                destination_uuid:
                  description: 'UUID of the destination to clone into.'
                  type: string
                name:
                  description: 'Optional name for the cloned application.'
                  type: [string, 'null']
                clone_volumes:
                  description: 'Whether to clone volume data. Needs the deploy ability.'
                  type: boolean
                  default: false
              type: object
      responses:
        '201':
          description: 'Application cloned.'
          content:
            application/json:
              schema:
                properties:
                  uuid: { type: string }
                  message: { type: string, example: 'Application cloned.' }
                type: object
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'The token needs the deploy ability to clone volume data.'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/applications/{uuid}/destinations':
    get:
      tags:
        - Applications
      summary: 'List Destinations'
      description: 'List primary and additional destinations for a standalone application.'
      operationId: list-application-destinations
      parameters:
        -
          name: uuid
          in: path
          description: 'UUID of the application.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Application destinations.'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Applications
      summary: 'Add Destination'
      description: 'Attach an additional standalone Docker destination to an application.'
      operationId: add-application-destination
      parameters:
        -
          name: uuid
          in: path
          description: 'UUID of the application.'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - destination_uuid
              properties:
                destination_uuid:
                  type: string
              type: object
      responses:
        '201':
          description: 'Destination attached.'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/applications/{uuid}/destinations/{destination_uuid}':
    delete:
      tags:
        - Applications
      summary: 'Remove Destination'
      description: 'Detach an additional destination from an application.'
      operationId: remove-application-destination
      parameters:
        -
          name: uuid
          in: path
          description: 'UUID of the application.'
          required: true
          schema:
            type: string
        -
          name: destination_uuid
          in: path
          description: 'UUID of the destination.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Destination detached.'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/applications/{uuid}/dns':
    get:
      tags:
        - DNS
      summary: 'Get Application DNS'
      description: 'DNS providers and managed DNS records for the domains of an application.'
      operationId: get-application-dns
      parameters:
        -
          name: uuid
          in: path
          description: 'Application UUID.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'DNS status.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDnsStatus'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'No access to the application.'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - DNS
      summary: 'Create Application DNS Record'
      description: 'Create a DNS record at Cloudflare that points a domain of the application to its server. An existing record with the same address is adopted.'
      operationId: create-application-dns-record
      parameters:
        -
          name: uuid
          in: path
          description: 'Application UUID.'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDnsRecordRequest'
      responses:
        '201':
          description: 'DNS record created.'
          content:
            application/json:
              schema:
                properties:
                  record: { $ref: '#/components/schemas/ManagedDnsRecord' }
                type: object
        '400':
          description: 'Cloudflare rejected the change.'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'No write access to the application.'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: 'Another record uses the hostname. Replace it with the replace endpoint.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsRecordConflict'
        '422':
          $ref: '#/components/responses/422'
        '423':
          description: 'Another DNS change for the hostname is in progress. Try again.'
      security:
        -
          bearerAuth: []
  '/applications/{uuid}/dns/{hostname}':
    delete:
      tags:
        - DNS
      summary: 'Release Application DNS Record'
      description: 'Release the managed DNS record of a hostname that the application no longer uses. Coolify deletes the record at Cloudflare only when it created the record, the record did not change, and no other resource uses the hostname. Removing a domain through the API already queues this release; use this endpoint to retry it or to keep the record.'
      operationId: release-application-dns-record
      parameters:
        -
          name: uuid
          in: path
          description: 'Application UUID.'
          required: true
          schema:
            type: string
        -
          name: hostname
          in: path
          description: 'Hostname of the record.'
          required: true
          schema:
            type: string
        -
          name: delete_record
          in: query
          description: 'Delete the record at Cloudflare. Default: true.'
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: 'Record released.'
          content:
            application/json:
              schema:
                properties:
                  result: { type: string, enum: [deleted, already_gone, not_owned, changed_externally, kept] }
                  message: { type: string }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'No write access to the application.'
        '404':
          description: 'No managed record of the application for the hostname.'
        '422':
          description: 'The application still uses the hostname.'
        '423':
          description: 'Another DNS change for the hostname is in progress. Try again.'
        '502':
          description: 'Cloudflare did not respond. Try again.'
      security:
        -
          bearerAuth: []
  '/applications/{uuid}/dns/replace':
    post:
      tags:
        - DNS
      summary: 'Replace Application DNS Record'
      description: 'Point the conflicting record from a 409 create response to the server of the application.'
      operationId: replace-application-dns-record
      parameters:
        -
          name: uuid
          in: path
          description: 'Application UUID.'
