        - Applications
      summary: 'Create Preview Deployment'
      description: 'Open a preview deployment for a pull request and queue its deployment. When the preview already exists, it is redeployed. A token with the deploy permission can only redeploy an existing preview without changes; opening a preview, changing its pull request URL, git type, or docker tag, or choosing a commit also needs the write permission. Git based applications need git_type unless they use a GitHub or GitLab App source; Bitbucket also needs commit. Docker Image applications need docker_tag for a new preview.'
      operationId: create-preview-deployment-by-application-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'UUID of the application.'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - pull_request_id
              properties:
                pull_request_id:
                  type: integer
                  example: 42
                  maximum: 2147483647
                  minimum: 1
                pull_request_html_url:
                  type: [string, 'null']
                  example: 'https://github.com/org/repo/pull/42'
                git_type:
                  description: 'Git provider that hosts the pull request. Sets the ref Coolify fetches (pull/{id}/head or merge-requests/{id}/head).'
                  type: [string, 'null']
                  enum: [github, gitlab, gitea, bitbucket]
                commit:
                  description: 'Commit SHA to deploy. Required for a new Bitbucket preview. Needs the write permission.'
                  type: [string, 'null']
                docker_tag:
                  description: 'Docker image tag. Docker Image applications only.'
                  type: [string, 'null']
                force:
                  description: 'Rebuild without cache.'
                  type: boolean
                  default: false
                instant_deploy:
                  description: 'Queue a deployment. Set to false to only create the preview, for example to set its domains first.'
                  type: boolean
                  default: true
              type: object
      responses:
        '200':
          description: 'Existing preview deployment updated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPreviewDeployment'
        '201':
          description: 'Preview deployment created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPreviewDeployment'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: 'Missing permissions. Opening or changing a preview needs the write permission.'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '429':
          description: 'Deployment queue is full.'
      security:
        -
          bearerAuth: []
