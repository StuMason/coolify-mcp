openapi: 3.1.0
info:
  title: Coolify
  version: '0.1'
paths:
  /services:
    get:
      tags:
        - Services
      summary: List
      description: 'List all services.'
      operationId: list-services
      responses:
        '200':
          description: 'Get all services'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Services
      summary: 'Create service'
      description: 'Create a one-click / custom service'
      operationId: create-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - server_uuid
                - project_uuid
                - environment_name
                - environment_uuid
              properties:
                type:
                  description: 'The one-click service type (e.g. "actualbudget", "calibre-web", "gitea-with-mysql" ...)'
                  type: string
                name:
                  type: string
                  maxLength: 255
                  description: 'Name of the service.'
                description:
                  type: string
                  nullable: true
                  description: 'Description of the service.'
                project_uuid:
                  type: string
                  description: 'Project UUID.'
                environment_name:
                  type: string
                  description: 'Environment name. You need to provide at least one of environment_name or environment_uuid.'
                environment_uuid:
                  type: string
                  description: 'Environment UUID. You need to provide at least one of environment_name or environment_uuid.'
                server_uuid:
                  type: string
                  description: 'Server UUID.'
                destination_uuid:
                  type: string
                  description: 'Destination UUID. Required if server has multiple destinations.'
                instant_deploy:
                  type: boolean
                  default: false
                  description: 'Start the service immediately after creation.'
                docker_compose_raw:
                  type: string
                  description: 'The base64 encoded Docker Compose content.'
                urls:
                  type: array
                  description: 'Array of URLs to be applied to containers of a service.'
                  items: { properties: { name: { type: string, description: 'The service name as defined in docker-compose.' }, url: { type: string, description: 'Comma-separated list of URLs (e.g. "https://app.coolify.io,https://app2.coolify.io").' } }, type: object }
                force_domain_override:
                  type: boolean
                  default: false
                  description: 'Force domain override even if conflicts are detected.'
                is_container_label_escape_enabled:
                  type: boolean
                  default: true
                  description: 'Escape special characters in labels. By default, $ (and other chars) is escaped. If you want to use env variables inside the labels, turn this off.'
                tags:
                  type: array
                  items: { type: string }
                  description: 'Tags to assign to the service.'
              type: object
      responses:
        '201':
          description: 'Service created successfully.'
          content:
            application/json:
              schema:
                properties:
                  uuid: { type: string, description: 'Service UUID.' }
                  domains: { type: array, items: { type: string }, description: 'Service domains.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '409':
          description: 'Domain conflicts detected.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Domain conflicts detected. Use force_domain_override=true to proceed.' }
                  warning: { type: string, example: 'Using the same domain for multiple resources can cause routing conflicts and unpredictable behavior.' }
                  conflicts: { type: array, items: { properties: { domain: { type: string, example: example.com }, resource_name: { type: string, example: 'My Application' }, resource_uuid: { type: string, nullable: true, example: abc123-def456 }, resource_type: { type: string, enum: [application, service, instance], example: application }, message: { type: string, example: "Domain example.com is already in use by application 'My Application'" } }, type: object } }
                type: object
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/services/{uuid}':
    get:
      tags:
        - Services
      summary: Get
      description: 'Get service by UUID.'
      operationId: get-service-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'Service UUID'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Get a service by UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - Services
      summary: Delete
      description: 'Delete service by UUID.'
      operationId: delete-service-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'Service UUID'
          required: true
          schema:
            type: string
        -
          name: delete_configurations
          in: query
          description: 'Delete configurations.'
          required: false
          schema:
            type: boolean
            default: true
        -
          name: delete_volumes
          in: query
          description: 'Delete volumes.'
          required: false
          schema:
            type: boolean
            default: true
        -
          name: docker_cleanup
          in: query
          description: 'Run docker cleanup.'
          required: false
          schema:
            type: boolean
            default: true
        -
          name: delete_connected_networks
          in: query
          description: 'Delete connected networks.'
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: 'Delete a service by UUID'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Service deletion request queued.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - Services
      summary: Update
      description: 'Update service by UUID.'
      operationId: update-service-by-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'UUID of the service.'
          required: true
          schema:
            type: string
      requestBody:
        description: 'Service updated.'
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  description: 'The service name.'
                description:
                  type: string
                  description: 'The service description.'
                instant_deploy:
                  type: boolean
                  description: 'The flag to indicate if the service should be deployed instantly.'
                connect_to_docker_network:
                  type: boolean
                  default: false
                  description: 'Connect the service to the predefined docker network.'
                docker_compose_raw:
                  type: string
                  description: 'The base64 encoded Docker Compose content.'
                urls:
                  type: array
                  description: 'Array of URLs to be applied to containers of a service.'
                  items: { properties: { name: { type: string, description: 'The service name as defined in docker-compose.' }, url: { type: string, description: 'Comma-separated list of URLs (e.g. "https://app.coolify.io,https://app2.coolify.io").' } }, type: object }
                force_domain_override:
                  type: boolean
                  default: false
                  description: 'Force domain override even if conflicts are detected.'
                is_container_label_escape_enabled:
                  type: boolean
                  default: true
                  description: 'Escape special characters in labels. By default, $ (and other chars) is escaped. If you want to use env variables inside the labels, turn this off.'
              type: object
      responses:
        '200':
          description: 'Service updated.'
          content:
            application/json:
              schema:
                properties:
                  uuid: { type: string, description: 'Service UUID.' }
                  domains: { type: array, items: { type: string }, description: 'Service domains.' }
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: 'Domain conflicts detected.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Domain conflicts detected. Use force_domain_override=true to proceed.' }
                  warning: { type: string, example: 'Using the same domain for multiple resources can cause routing conflicts and unpredictable behavior.' }
                  conflicts: { type: array, items: { properties: { domain: { type: string, example: example.com }, resource_name: { type: string, example: 'My Application' }, resource_uuid: { type: string, nullable: true, example: abc123-def456 }, resource_type: { type: string, enum: [application, service, instance], example: application }, message: { type: string, example: "Domain example.com is already in use by application 'My Application'" } }, type: object } }
                type: object
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/services/{uuid}/applications':
    get:
      tags:
        - 'Service applications'
      summary: 'List service applications'
      description: 'List compose service applications (containers) for a single service.'
      operationId: list-service-applications-by-service-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'Service UUID.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Service applications for this service.'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
  '/services/{uuid}/applications/{app_uuid}':
    get:
      tags:
        - 'Service applications'
      summary: 'Get service application'
      description: 'Get a single compose service application by service UUID and application UUID.'
      operationId: get-service-application-by-service-and-app-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'Service UUID.'
          required: true
          schema:
            type: string
        -
          name: app_uuid
          in: path
          description: 'Service application UUID.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Service application.'
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - 'Service applications'
      summary: 'Update service application'
      description: 'Update fields for a compose service application. Use `url` for comma-separated public URLs (same rules as `urls[].url` on PATCH /services/{uuid}).'
      operationId: patch-service-application-by-service-and-app-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'Service UUID.'
          required: true
          schema:
            type: string
        -
          name: app_uuid
          in: path
          description: 'Service application UUID.'
          required: true
          schema:
            type: string
        -
          name: force_domain_override
          in: query
          description: 'When true, allow duplicate URLs in the request and proceed despite domain conflicts (same as service PATCH).'
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        content:
          application/json:
            schema:
              properties:
                url:
                  description: 'Comma-separated list of URLs (e.g. "http://app.example.com:8080,https://app2.example.com"). Stored as fqdn.'
                  type: [string, 'null']
                human_name:
                  type: [string, 'null']
                description:
                  type: [string, 'null']
                image:
                  type: [string, 'null']
                exclude_from_status:
                  type: [boolean, 'null']
                is_log_drain_enabled:
                  type: [boolean, 'null']
                is_gzip_enabled:
                  type: [boolean, 'null']
                is_stripprefix_enabled:
                  type: [boolean, 'null']
              type: object
      responses:
        '200':
          description: 'Updated service application.'
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: 'Domain conflicts (unless force_domain_override).'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/services/{uuid}/applications/{app_uuid}/logs':
    get:
      tags:
        - 'Service applications'
      summary: 'Get service application logs'
      description: 'Get Docker logs for a single compose service container.'
      operationId: get-service-application-logs-by-service-and-app-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'Service UUID.'
          required: true
          schema:
            type: string
        -
          name: app_uuid
          in: path
          description: 'Service application UUID.'
          required: true
          schema:
            type: string
        -
          name: lines
          in: query
          description: 'Number of lines to show from the end of the logs.'
          required: false
          schema:
            type: integer
            format: int32
            default: 100
      responses:
        '200':
          description: Logs.
          content:
            application/json:
              schema:
                properties:
                  logs: { type: string }
                type: object
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '501':
          description: 'Swarm not supported.'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - 'Service applications'
      summary: 'Get service application logs'
      description: 'Get Docker logs for a single compose service container.'
      operationId: post-service-application-logs-by-service-and-app-uuid
      parameters:
        -
          name: uuid
          in: path
          required: true
          schema:
            type: string
        -
          name: app_uuid
          in: path
          required: true
          schema:
            type: string
        -
          name: lines
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 100
      responses:
        '200':
          description: Logs.
          content:
            application/json:
              schema:
                properties:
                  logs: { type: string }
                type: object
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '501':
          description: 'Swarm not supported.'
      security:
        -
          bearerAuth: []
  '/services/{uuid}/applications/{app_uuid}/restart':
    post:
      tags:
        - 'Service applications'
      summary: 'Restart service application container'
      description: 'Restarts a single compose service container.'
      operationId: post-restart-service-application-by-service-and-app-uuid
      parameters:
        -
          name: uuid
          in: path
          required: true
          schema:
            type: string
        -
          name: app_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Restart queued.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string }
                type: object
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '501':
          description: 'Swarm not supported.'
      security:
        -
          bearerAuth: []
  '/services/{uuid}/applications/{app_uuid}/start':
    post:
      tags:
        - 'Service applications'
      summary: 'Start or redeploy service application container'
      description: 'Runs docker compose up for a single compose service (no-deps), optionally pulling the image and rebuilding.'
      operationId: post-start-service-application-by-service-and-app-uuid
      parameters:
        -
          name: uuid
          in: path
          required: true
          schema:
            type: string
        -
          name: app_uuid
          in: path
          required: true
          schema:
            type: string
        -
          name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
        -
          name: latest
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 'Deploy request queued.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string }
                type: object
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '501':
          description: 'Swarm not supported.'
      security:
        -
          bearerAuth: []
  '/services/{uuid}/applications/{app_uuid}/stop':
    post:
      tags:
        - 'Service applications'
      summary: 'Stop service application container'
      description: 'Stops a single compose service container.'
      operationId: post-stop-service-application-by-service-and-app-uuid
      parameters:
        -
          name: uuid
          in: path
          required: true
          schema:
            type: string
        -
          name: app_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Stop queued.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string }
                type: object
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '501':
          description: 'Swarm not supported.'
      security:
        -
          bearerAuth: []
  '/services/{uuid}/databases':
    get:
      tags:
        - 'Service databases'
      summary: 'List service databases'
      description: 'List compose databases for a single service.'
      operationId: list-service-databases-by-service-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'Service UUID.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Service databases.'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
  '/services/{uuid}/databases/{database_uuid}':
    get:
      tags:
        - 'Service databases'
      summary: 'Get service database'
      description: 'Get a compose database by service UUID and database UUID.'
      operationId: get-service-database-by-service-and-database-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'Service UUID.'
          required: true
          schema:
            type: string
        -
          name: database_uuid
          in: path
          description: 'Service database UUID.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Service database.'
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - 'Service databases'
      summary: 'Update service database'
      description: 'Update mutable fields for a compose service database.'
      operationId: patch-service-database-by-service-and-database-uuid
      parameters:
        -
          name: uuid
          in: path
          description: 'Service UUID.'
          required: true
          schema:
            type: string
        -
          name: database_uuid
          in: path
          description: 'Service database UUID.'
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                human_name:
                  type: [string, 'null']
                description:
                  type: [string, 'null']
                image:
                  type: string
                exclude_from_status:
                  type: boolean
                is_log_drain_enabled:
                  type: boolean
                is_public:
                  type: boolean
                public_port:
                  type: [integer, 'null']
                  maximum: 65535
                  minimum: 1
                public_port_timeout:
                  type: [integer, 'null']
                  minimum: 1
              type: object
              additionalProperties: false
      responses:
        '200':
          description: 'Updated service database.'
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      security:
        -
          bearerAuth: []
  '/services/{uuid}/databases/{database_uuid}/logs':
    get:
      tags:
        - 'Service databases'
      summary: 'Get service database logs'
      description: 'Get Docker logs for a compose database container.'
      operationId: get-service-database-logs-by-service-and-database-uuid
      parameters:
        -
          name: uuid
          in: path
          required: true
          schema:
            type: string
        -
          name: database_uuid
          in: path
          required: true
          schema:
            type: string
        -
          name: lines
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 100
      responses:
        '200':
          description: Logs.
          content:
            application/json:
              schema:
                properties:
                  logs: { type: string }
                type: object
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '501':
          description: 'Swarm not supported.'
      security:
        -
          bearerAuth: []
  '/services/{uuid}/databases/{database_uuid}/restart':
    post:
      tags:
        - 'Service databases'
      summary: 'Restart service database container'
      description: 'Restart a compose database container.'
      operationId: restart-service-database-by-service-and-database-uuid
      parameters:
        -
          name: uuid
          in: path
          required: true
          schema:
            type: string
        -
          name: database_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Restart queued.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string }
                type: object
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '501':
          description: 'Swarm not supported.'
      security:
        -
          bearerAuth: []
  '/services/{uuid}/databases/{database_uuid}/start':
    post:
      tags:
        - 'Service databases'
      summary: 'Start or redeploy service database container'
      description: 'Run docker compose up for a single compose database.'
      operationId: start-service-database-by-service-and-database-uuid
      parameters:
        -
          name: uuid
          in: path
          required: true
          schema:
            type: string
        -
          name: database_uuid
          in: path
          required: true
          schema:
            type: string
        -
          name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
        -
          name: latest
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 'Deploy request queued.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string }
                type: object
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '501':
          description: 'Swarm not supported.'
      security:
        -
          bearerAuth: []
  '/services/{uuid}/databases/{database_uuid}/stop':
    post:
      tags:
        - 'Service databases'
      summary: 'Stop service database container'
      description: 'Stop a compose database container.'
      operationId: stop-service-database-by-service-and-database-uuid
      parameters:
        -
          name: uuid
          in: path
          required: true
          schema:
            type: string
        -
          name: database_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Stop queued.'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string }
                type: object
        '400':
          $ref: '#/components/responses/400'
